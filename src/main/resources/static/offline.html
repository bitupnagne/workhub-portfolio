<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>오프라인 · WorkHub</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin:0; min-height:100dvh; display:flex; align-items:center; justify-content:center;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
      background:#f6f8fa; color:#1f2937; padding:24px; }
    .card { text-align:center; max-width:340px }
    .ico { width:72px; height:72px; margin:0 auto 18px; border-radius:20px;
      background:linear-gradient(135deg,#4F46E5,#4338CA); display:flex; align-items:center; justify-content:center }
    h1 { font-size:20px; margin:0 0 8px }
    p { font-size:14px; color:#6b7280; line-height:1.6; margin:0 0 20px }
    button { border:0; border-radius:12px; padding:13px 28px; font-size:15px; font-weight:700;
      background:linear-gradient(135deg,#4F46E5,#4338CA); color:#fff; cursor:pointer }
  </style>
</head>
<body>
  <div class="card">
    <div class="ico">
      <svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 1l22 22"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/><path d="M10.71 5.05A16 16 0 0 1 22.58 9"/><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/>
      </svg>
    </div>
    <h1>오프라인 상태입니다</h1>
    <p>네트워크 연결이 끊겼습니다.<br>연결을 확인한 뒤 다시 시도해 주세요.</p>
    <button onclick="location.reload()">다시 시도</button>
  </div>
</body>
</html>
