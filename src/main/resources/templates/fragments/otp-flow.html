<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="flow(entry)">
  <div id="wsOtpFlow" th:data-entry="${entry}" th:data-base="@{/}"
       th:data-csrf-header="${_csrf.headerName}" th:data-csrf-token="${_csrf.token}">
    <span th:if="${entry == 'setup'}" data-otp-enrollment
          th:data-qr="${qrDataUri}" th:data-secret="${secret}" th:data-account="${account}" hidden></span>

    <dialog data-otp-management class="otp-modal-card" aria-labelledby="wsOtpManageTitle" th:if="${entry == 'manage'}">
      <h2 id="wsOtpManageTitle" class="otp-modal-title">2차 인증 관리</h2>
      <p>이 계정에 2차 인증이 등록되어 있습니다.</p>
      <button type="button" class="btn" data-otp-close autofocus>닫기</button>
      <button type="button" class="btn danger" data-otp-disable>2차 인증 해제</button>
    </dialog>
    <div data-otp-notice class="otp-inline-toast" role="status" aria-live="polite" hidden></div>
    <div data-otp-recovery class="otp-modal-backdrop" hidden style="display:none">
      <div class="otp-modal-card">
        <p role="alert" data-otp-error></p>
        <button type="button" class="btn primary" data-otp-retry>다시 시도</button>
        <button type="button" class="btn" data-otp-cancel>취소</button>
      </div>
    </div>
    <form th:if="${entry != 'manage'}" th:action="@{/logout}" method="post" data-otp-logout hidden>
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    </form>
  </div>
  <script th:src="@{/otp-ui/system-otp.js}" defer></script>
  <script th:src="@{/js/worksystem-otp-flow.js}" defer></script>
</th:block>
</body>
</html>
