<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="|${target.name} 인사카드|">인사카드</title>
<link rel="icon" type="image/svg+xml" th:href="@{/img/AppLogoMini.svg}"><link rel="stylesheet" th:href="@{/css/worksystem.css}">
<!-- 페이지 이동 화면 전환 오류 정리 — 첫 화면 그리기 전에 실행돼야 해서 head 에 둔다 -->
<script th:src="@{/js/worksystem-view-transition.js}"></script>
</head><body><div class="app"><div th:replace="~{fragments/app :: sidebar}"></div><main><div th:replace="~{fragments/app :: topbar}"></div><div class="content admin-page personnel-card">
<div class="banner ok" th:if="${message}" th:text="${message}"></div><div class="banner err" th:if="${error}" th:text="${error}"></div>
<div class="personnel-actions"><a class="btn" th:if="${canManageOrganization}" th:href="@{/people(view='list')}">직원 목록</a><a class="btn" th:unless="${canManageOrganization}" th:href="@{/org}">회사 조직도</a><a class="btn" th:if="${target.id == currentUser.userId}" th:href="@{/mypage}">내 계정 설정</a></div>
<section class="form-panel resume-card"><div class="resume-head"><div class="resume-photo"><span class="user-avt resume-avt" th:if="${#strings.isEmpty(target.profileImageFilename)}" th:text="${#strings.substring(target.name,0,target.name.length()>1?2:1)}">직원</span><img class="resume-avt" th:unless="${#strings.isEmpty(target.profileImageFilename)}" th:src="@{/profile-images/{f}(f=${target.profileImageFilename})}" alt="프로필 사진"></div><div class="resume-title"><h2 th:text="${target.name}">이름</h2><p class="resume-sub" th:text="|${target.teamName ?: '소속 없음'} · ${target.dept ?: '-'}|">소속</p><div class="resume-meta"><span>사번 <b th:text="${target.employeeNumber ?: '-'}">-</b></span><span>입사일 <b th:text="${target.hireDate ?: '-'}">-</b></span><span th:text="${target.active ? '재직' : '비활성'}">재직</span></div></div></div>
<dl class="resume-table"><dt>로그인 ID</dt><dd th:text="${target.username}">ID</dd><dt>등급</dt><dd th:text="${target.gradeName ?: '미지정'}">등급</dd><dt>담당업무</dt><dd th:text="${target.jobTitle ?: '-'}">업무</dd><dt>구분</dt><dd th:text="${target.contractor ? '도급' : '직영'}">직영</dd><dt>내선번호</dt><dd th:text="${target.extensionNumber ?: '-'}">-</dd><dt>휴대폰</dt><dd th:text="${target.mobileNumber ?: '-'}">-</dd><dt>이메일</dt><dd class="resume-span" th:text="${target.email ?: '-'}">-</dd></dl></section>
<section class="form-panel personnel-form" th:if="${canManageOrganization}"><div class="section-head ws-edit-surface-head"><h2>인사정보</h2></div><form data-edit-form data-edit-title="인사정보" th:action="@{/people/{id}(id=${target.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="admin-form-grid">
<div class="field"><label for="personName">이름</label><input id="personName" name="name" th:value="${target.name}" required></div><div class="field"><label for="personNumber">사번</label><input id="personNumber" name="employeeNumber" th:value="${target.employeeNumber}"></div>
<div class="field"><label for="personTeam">소속</label><select id="personTeam" name="teamId"><option value="">소속 없음</option><option th:each="team : ${editTeams}" th:value="${team.id}" th:selected="${team.id == target.teamId}" th:text="${team.name}">팀</option></select></div><div class="field"><label for="personDept">부서·직무</label><input id="personDept" name="dept" th:value="${target.dept}" required></div>
<div class="field"><label for="personGrade">등급</label><select id="personGrade" name="gradeId"><option value="">미지정</option><option th:each="grade : ${editGrades}" th:value="${grade.id}" th:selected="${grade.id == target.gradeId}" th:text="${grade.name}">등급</option></select></div><div class="field"><label for="personHire">입사일</label><input id="personHire" name="hireDate" type="date" th:value="${target.hireDate}"></div>
<div class="field"><label for="personJob">담당업무</label><input id="personJob" name="jobTitle" th:value="${target.jobTitle}"></div><div class="field"><label for="personExtension">내선번호</label><input id="personExtension" name="extensionNumber" th:value="${target.extensionNumber}"></div><div class="field"><label for="personMobile">휴대폰</label><input id="personMobile" name="mobileNumber" th:value="${target.mobileNumber}"></div><div class="field"><label for="personEmail">이메일</label><input id="personEmail" name="email" type="email" th:value="${target.email}"></div>
<label class="check-label"><input type="checkbox" name="active" value="true" th:checked="${target.active}">재직 상태 유지</label><label class="check-label"><input type="checkbox" name="contractor" value="true" th:checked="${target.contractor}">도급 직원</label></div><div class="form-actions"><button class="btn primary" type="submit">인사정보 저장</button></div></form></section>
<section class="form-panel personnel-history"><h2>인사정보 변경이력</h2><div class="table-scroll"><table class="rt admin-data-table"><thead><tr><th>시각</th><th>항목</th><th>이전</th><th>변경 후</th><th>수정자</th></tr></thead><tbody><tr class="empty-tr" th:if="${#lists.isEmpty(changeLogs)}"><td colspan="5">변경 이력이 없습니다.</td></tr><tr th:each="change : ${changeLogs}"><td th:text="${#temporals.format(change.changedAt,'yyyy-MM-dd HH:mm')}">시각</td><td th:text="${change.fieldLabel}">항목</td><td th:text="${change.oldText}">이전</td><td th:text="${change.newText}">이후</td><td th:text="${change.changedByName ?: '시스템'}">수정자</td></tr></tbody></table></div></section>
<section class="form-panel personnel-history" th:if="${!#lists.isEmpty(transferHistory)}"><h2>발령 이력</h2><div class="table-scroll"><table class="rt admin-data-table"><thead><tr><th>발령일</th><th>이전 소속</th><th>이동 소속</th><th>상태</th></tr></thead><tbody><tr th:each="transfer : ${transferHistory}"><td th:text="${transfer.effectiveDate}">일자</td><td th:text="${transfer.fromTeamName ?: '-'}">소속</td><td th:text="${transfer.toTeamName ?: '-'}">소속</td><td th:text="${transfer.applied ? '반영 완료' : '발령 예정'}">상태</td></tr></tbody></table></div></section>
<section class="form-panel personnel-history" th:if="${canManageOrganization and target.id != currentUser.userId}"><h2>계정 관리</h2><div class="personnel-security"><p class="personnel-security-note">비밀번호를 초기화하면 다음 로그인에서 비밀번호를 변경해야 합니다.</p><div class="personnel-security-actions"><form th:action="@{/admin/users/{id}/password-reset(id=${target.id})}" method="post" data-confirm-message="직원의 비밀번호를 초기화하시겠습니까?"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn" type="submit">비밀번호 초기화</button></form><form th:action="@{/admin/users/{id}/otp-reset(id=${target.id})}" method="post" data-confirm-message="직원의 OTP를 초기화하시겠습니까?"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn" type="submit">OTP 초기화</button></form><form th:action="@{/admin/users/{id}/delete(id=${target.id})}" method="post" data-confirm-message="직원을 비활성 처리하시겠습니까?" data-confirm-danger="true"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn danger" type="submit">직원 비활성</button></form></div></div></section>
</div></main></div></body></html>
