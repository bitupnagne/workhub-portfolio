<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>일시적인 오류 — 오피스 시스템</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/img/AppLogoMini.svg}">
  <link rel="stylesheet" th:href="@{/css/worksystem.css}">
  <!-- 페이지 이동 화면 전환 오류 정리 — 첫 화면 그리기 전에 실행돼야 해서 head 에 둔다 -->
  <script th:src="@{/js/worksystem-view-transition.js}"></script>
</head>
<body class="ws-error-body">
  <main class="ws-error-card">
    <img class="ws-error-logo" th:src="@{/img/AppLogoMini.svg}" alt="">
    <div class="ws-error-code" th:text="${status ?: '오류'}">500</div>
    <h1>일시적인 오류가 발생했어요</h1>
    <p>서버 점검(재시작) 중이거나 일시적인 문제일 수 있습니다.<br>잠시 후 다시 시도해 주세요.</p>
    <div class="ws-error-actions">
      <a class="btn primary" href="/login?relogin=1">로그인 화면으로</a>
      <a class="btn" href="javascript:location.reload()">다시 시도</a>
    </div>
  </main>
</body>
</html>
