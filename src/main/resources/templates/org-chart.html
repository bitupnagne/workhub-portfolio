<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">회사 조직도</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/img/AppLogoMini.svg}">
  <link rel="stylesheet" th:href="@{/css/worksystem.css}">
  <!-- 페이지 이동 화면 전환 오류 정리 — 첫 화면 그리기 전에 실행돼야 해서 head 에 둔다 -->
  <script th:src="@{/js/worksystem-view-transition.js}"></script>
</head>
<body>
<div class="app">
  <div th:replace="~{fragments/app :: sidebar}"></div>
  <main>
    <div th:replace="~{fragments/app :: topbar}"></div>
    <div class="content admin-page">
      <div class="admin-title-row">
        <div>
          <h2>회사 조직도</h2>
        </div>
      </div>

      <section class="section-block org-chart-section">
        <div class="section-header no-caret">
          <div class="section-left">
            <span class="sdot sdot-done"></span>
            <span class="sname">조직도</span>
            <span class="scnt scnt-done" th:text="${#lists.size(organizationNodes)}">0</span>
          </div>
        </div>
        <div class="org-chart org-chart-members">
          <div class="org-root-wrap" th:each="root : ${organizationTree}">
            <div class="org-chart-card root">
              <span class="org-type">대표</span>
              <strong th:text="${root.team.name}">대표이사</strong>
              <em th:classappend="${root.team.leaderName == null} ? ' unassigned'" th:text="${root.team.leaderName != null ? root.team.leaderName : '미지정'}">조직장</em>
              <p class="org-members-zero" th:if="${#lists.isEmpty(organizationMembers.byTeam[root.team.id])}">소속 직원 0명</p>
              <details class="org-members" th:if="${!#lists.isEmpty(organizationMembers.byTeam[root.team.id])}" th:data-org-team-id="${root.team.id}" th:with="members=${organizationMembers.byTeam[root.team.id]}">
                <summary><span>소속 직원 <b th:text="${#lists.size(members)}">0</b>명</span></summary>
                <ul class="org-member-list" th:if="${!#lists.isEmpty(members)}">
                  <li class="org-member-row" th:each="member : ${members}">
                    <strong th:text="${member.name}">직원명</strong>
                    <small th:if="${!#strings.isEmpty(member.jobTitle)}" th:text="${member.jobTitle}">직급</small>
                  </li>
                </ul>
                <p class="org-member-empty" th:if="${#lists.isEmpty(members)}">소속 직원이 없습니다.</p>
              </details>
            </div>
            <div class="org-branches" th:if="${!#lists.isEmpty(root.children)}">
              <div class="org-branch" th:each="division : ${root.children}">
                <div class="org-chart-card" th:classappend="${division.team.nodeType == 'DIVISION'} ? ' division' : ' team'">
                  <span class="org-type" th:text="${division.team.nodeType == 'DIVISION' ? '본부' : '팀'}">본부</span>
                  <strong th:text="${division.team.name}">본부명</strong>
                  <em th:classappend="${division.team.leaderName == null} ? ' unassigned'" th:text="${division.team.leaderName != null ? division.team.leaderName : '미지정'}">조직장</em>
                  <p class="org-members-zero" th:if="${#lists.isEmpty(organizationMembers.byTeam[division.team.id])}">소속 직원 0명</p>
                  <details class="org-members" th:if="${!#lists.isEmpty(organizationMembers.byTeam[division.team.id])}" th:data-org-team-id="${division.team.id}" th:with="members=${organizationMembers.byTeam[division.team.id]}">
                    <summary><span>소속 직원 <b th:text="${#lists.size(members)}">0</b>명</span></summary>
                    <ul class="org-member-list" th:if="${!#lists.isEmpty(members)}">
                      <li class="org-member-row" th:each="member : ${members}">
                        <strong th:text="${member.name}">직원명</strong>
                        <small th:if="${!#strings.isEmpty(member.jobTitle)}" th:text="${member.jobTitle}">직급</small>
                      </li>
                    </ul>
                    <p class="org-member-empty" th:if="${#lists.isEmpty(members)}">소속 직원이 없습니다.</p>
                  </details>
                </div>
                <div class="org-team-grid" th:if="${!#lists.isEmpty(division.children)}">
                  <div class="org-team-node" th:each="teamNode : ${division.children}">
                    <div class="org-chart-card team">
                      <span class="org-type" th:text="${teamNode.team.nodeType == 'DIVISION' ? '본부' : '팀'}">팀</span>
                      <strong th:text="${teamNode.team.name}">팀명</strong>
                      <em th:classappend="${teamNode.team.leaderName == null} ? ' unassigned'" th:text="${teamNode.team.leaderName != null ? teamNode.team.leaderName : '미지정'}">조직장</em>
                      <p class="org-members-zero" th:if="${#lists.isEmpty(organizationMembers.byTeam[teamNode.team.id])}">소속 직원 0명</p>
                      <details class="org-members" th:if="${!#lists.isEmpty(organizationMembers.byTeam[teamNode.team.id])}" th:data-org-team-id="${teamNode.team.id}" th:with="members=${organizationMembers.byTeam[teamNode.team.id]}">
                        <summary><span>소속 직원 <b th:text="${#lists.size(members)}">0</b>명</span></summary>
                        <ul class="org-member-list" th:if="${!#lists.isEmpty(members)}">
                          <li class="org-member-row" th:each="member : ${members}">
                            <strong th:text="${member.name}">직원명</strong>
                            <small th:if="${!#strings.isEmpty(member.jobTitle)}" th:text="${member.jobTitle}">직급</small>
                          </li>
                        </ul>
                        <p class="org-member-empty" th:if="${#lists.isEmpty(members)}">소속 직원이 없습니다.</p>
                      </details>
                    </div>
                    <div class="org-subteam-list" th:if="${!#lists.isEmpty(teamNode.children)}">
                      <div class="org-subteam" th:each="child : ${teamNode.children}">
                        <div class="org-subteam-head">
                          <b th:text="${child.team.name}">하위 조직</b>
                          <span th:classappend="${child.team.leaderName == null} ? ' unassigned'" th:text="${child.team.leaderName != null ? child.team.leaderName : '미지정'}">조직장</span>
                        </div>
                        <p class="org-members-zero" th:if="${#lists.isEmpty(organizationMembers.byTeam[child.team.id])}">소속 직원 0명</p>
                        <details class="org-members" th:if="${!#lists.isEmpty(organizationMembers.byTeam[child.team.id])}" th:data-org-team-id="${child.team.id}" th:with="members=${organizationMembers.byTeam[child.team.id]}">
                          <summary><span>소속 직원 <b th:text="${#lists.size(members)}">0</b>명</span></summary>
                          <ul class="org-member-list" th:if="${!#lists.isEmpty(members)}">
                            <li class="org-member-row" th:each="member : ${members}">
                              <strong th:text="${member.name}">직원명</strong>
                              <small th:if="${!#strings.isEmpty(member.jobTitle)}" th:text="${member.jobTitle}">직급</small>
                            </li>
                          </ul>
                          <p class="org-member-empty" th:if="${#lists.isEmpty(members)}">소속 직원이 없습니다.</p>
                        </details>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="org-unassigned-members" th:if="${!#lists.isEmpty(organizationMembers.unassigned)}">
            <details class="org-members" data-org-unassigned th:with="members=${organizationMembers.unassigned}">
              <summary><span>미소속 직원 <b th:text="${#lists.size(members)}">0</b>명</span></summary>
              <ul class="org-member-list" th:if="${!#lists.isEmpty(members)}">
                <li class="org-member-row" th:each="member : ${members}">
                  <strong th:text="${member.name}">직원명</strong>
                  <small th:if="${!#strings.isEmpty(member.jobTitle)}" th:text="${member.jobTitle}">직급</small>
                </li>
              </ul>
              <p class="org-member-empty" th:if="${#lists.isEmpty(members)}">소속 직원이 없습니다.</p>
            </details>
          </div>
        </div>
      </section>
    </div>
  </main>
</div>
</body>
</html>
