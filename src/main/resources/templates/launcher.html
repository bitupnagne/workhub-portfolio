<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>메뉴 — 오피스 시스템</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/img/AppLogoMini.svg}">
  <link rel="stylesheet" th:href="@{/css/worksystem.css}">
</head>
<body class="launcher-body">
  <!-- [UX49] 외부망 런처 — 대시보드 숨김 시 홈. 사이드메뉴 없이 접근 가능한 메뉴만 카드로. -->
  <header class="launcher-head">
    <div class="launcher-brand">
      <img th:src="@{/system-logo/web}" alt="회사 로고">
    </div>
    <div class="launcher-user">
      <b th:text="${currentUser.name}">사용자</b>
      <span class="muted" th:text="${currentUser.teamName ?: ''}">팀</span>
      <form th:action="@{/logout}" method="post" style="margin:0;">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button class="rbtn" type="submit">로그아웃</button>
      </form>
    </div>
  </header>

  <main class="launcher-main">
    <p class="launcher-hint">이용 가능한 메뉴입니다.</p>
    <!-- [UX51] 큰 메뉴(그룹) 카드 — 카드 안에 세부 메뉴 링크 나열 -->
    <div class="launcher-grid">
      <div class="launcher-card" th:each="g : ${launchGroups}">
        <div class="launcher-card-head">
          <span class="launcher-icon" aria-hidden="true" th:switch="${g.groupKey}">
            <svg th:case="'projects'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 10v10M15 10v10"/></svg>
            <svg th:case="'reports'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></svg>
            <svg th:case="'organization'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/><path d="M10 6h4"/><path d="M10 10h4"/><path d="M10 14h4"/><path d="M10 18h4"/></svg>
            <svg th:case="'communication'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg>
            <svg th:case="'super-admin'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1Z"/><path d="m9 12 2 2 4-4"/></svg>
            <svg th:case="'hr'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="7" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
            <svg th:case="'documents'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>
            <svg th:case="'members'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            <svg th:case="*" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="3"/></svg>
          </span>
          <span class="launcher-label" th:text="${g.groupLabel}">큰 메뉴</span>
        </div>
        <div class="launcher-items">
          <a class="launcher-item" th:each="it : ${g.items}" th:href="${it.url}" th:text="${it.label}">세부 메뉴</a>
        </div>
      </div>
    </div>
    <p class="launcher-empty" th:if="${#lists.isEmpty(launchGroups)}">이용 가능한 메뉴가 없습니다. 관리자에게 문의하세요.</p>
  </main>
</body>
</html>
