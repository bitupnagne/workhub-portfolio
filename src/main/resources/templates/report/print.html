<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="|주간보고 출력 - ${printTitle}|">주간보고 출력</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/img/AppLogoMini.svg}">
  <link rel="stylesheet" th:href="@{/system-theme.css}">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Malgun Gothic','Apple SD Gothic Neo','Segoe UI',Arial,sans-serif;color:#111827;font-size:12px;background:#fff}
    .wrap{max-width:820px;margin:0 auto;padding:36px 32px}
    .print-action{position:fixed;top:16px;right:16px;z-index:20;display:flex;gap:8px}
    .print-btn{border:none;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
    .print-btn.primary{background:var(--system-brand,#4F46E5);color:#fff}
    .print-btn.secondary{background:#F3F4F6;color:#374151;border:1px solid #D1D5DB}
    .ph{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px;padding-bottom:14px;border-bottom:2.5px solid var(--system-brand,#4F46E5)}
    .ph-logo{font-size:20px;font-weight:800;color:var(--system-brand,#4F46E5);letter-spacing:0}
    .ph-logo span{color:#6B7280;font-size:16px;font-weight:600}
    .ph-right{text-align:right}
    .ph-title{font-size:15px;font-weight:800;letter-spacing:0}
    .ph-meta{font-size:11px;color:#6B7280;margin-top:3px}
    .confirmed{display:inline-flex;margin-top:7px;padding:3px 8px;border-radius:999px;background:#D1FAE5;color:#065F46;font-size:10px;font-weight:800}
    .team-block{margin-bottom:20px}
    .team-hd{font-size:14px;font-weight:800;padding:10px 14px;background:var(--system-brand-light,#F8FAFF);border-left:4px solid var(--system-brand,#4F46E5);margin-bottom:8px;display:flex;align-items:center;gap:10px}
    .team-badge{font-size:10px;font-weight:800;padding:2px 8px;border-radius:999px;background:#D1FAE5;color:#065F46}
    .sec-block{margin-bottom:10px;border-radius:8px;overflow:hidden;border:1px solid #E5E7EB}
    .sec-hd{font-size:12px;font-weight:800;padding:7px 14px;display:flex;align-items:center;gap:8px}
    .new .sec-hd{background:#E6F1FB;color:#185FA5}
    .cont .sec-hd{background:#FAEEDA;color:#854F0B}
    .done .sec-hd{background:var(--system-brand-light,#EEF2FF);color:var(--system-brand-deeper,#3730A3)}
    .sec-cnt{display:inline-flex;align-items:center;justify-content:center;min-width:20px;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--system-brand,#4F46E5);color:#fff;white-space:nowrap}
    table{width:100%;border-collapse:collapse}
    th{font-size:10px;font-weight:700;color:#6B7280;text-align:left;padding:6px 12px;background:#F9FAFB;border-bottom:1px solid #E5E7EB}
    td{padding:7px 12px;font-size:12px;border-bottom:1px solid #F3F4F6;vertical-align:middle}
    tr:last-child td{border-bottom:none}
    .empty{text-align:center;color:#9CA3AF;padding:12px;font-size:11px}
    .det-row{background:#F9FAFB}
    .det-row td{font-size:11px;color:#4B5563}
    .det-cell{padding-left:22px;color:var(--system-brand-deeper,#3730A3)}
    .footer{margin-top:32px;padding-top:10px;border-top:1px solid #E5E7EB;font-size:10px;color:#9CA3AF;display:flex;justify-content:space-between}
    /* [P4] 미확정 초안 안내 + 대각선 워터마크 */
    .draft-note{display:flex;align-items:center;gap:8px;margin-bottom:16px;padding:9px 14px;border-radius:8px;background:#FEF3C7;border:1px solid #FCD34D;color:#854F0B;font-size:11px;font-weight:700}
    .draft-note b{font-weight:800}
    .draft-wm{position:fixed;inset:0;z-index:0;pointer-events:none;display:flex;align-items:center;justify-content:center;overflow:hidden}
    .draft-wm span{font-size:120px;font-weight:800;color:rgba(234,88,12,.08);letter-spacing:12px;transform:rotate(-32deg);white-space:nowrap;user-select:none}
    .wrap{position:relative;z-index:1}
    @media screen{
      .print-action{position:static;max-width:820px;margin:0 auto;padding:16px 32px 0;justify-content:flex-end;flex-wrap:wrap}
      .print-btn{white-space:nowrap}
      .wrap{padding-top:24px}
      .ph{gap:16px}
      .ph-logo{white-space:nowrap;flex-shrink:0}
      .ph-right{min-width:0}
    }
    @media screen and (max-width:640px){
      .print-action{padding-right:16px;padding-left:16px}
      .wrap{padding:24px 16px}
      .ph{flex-direction:column;align-items:stretch;gap:12px}
      .ph-right{text-align:left}
    }
    @page{size:A4;margin:18mm}
    @media print{
      *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
      html,body{width:210mm;background:#fff}
      body{font-size:12px}
      .print-action{display:none!important}
      .wrap{width:100%;max-width:none;margin:0;padding:0}
      .ph{break-after:avoid;page-break-after:avoid}
      .sec-block{break-inside:avoid;page-break-inside:avoid}
      table{break-inside:auto;page-break-inside:auto}
      thead{display:table-header-group}
      tr{break-inside:avoid;page-break-inside:avoid}
      .team-block{break-inside:avoid-page;page-break-inside:avoid}
      .team-break{break-after:page;page-break-after:always}
      .footer{break-inside:avoid;page-break-inside:avoid}
    }
  </style>
  <link rel="stylesheet" th:href="@{/css/worksystem-project-report.css}">
</head>
<body>
<div class="print-action">
  <button class="print-btn secondary" type="button" onclick="window.close()">닫기</button>
  <button class="print-btn primary" type="button" onclick="window.print()">인쇄 / PDF 저장</button>
</div>

<div class="draft-wm" th:unless="${confirmed}" aria-hidden="true"><span>초안 · 미확정</span></div>

<div class="wrap">
  <div class="draft-note" th:unless="${confirmed}">
    <b>초안 · 미확정 문서입니다.</b><span>아직 주간보고 관리자가 확정하지 않은 임시 내용으로, 최종본이 아닙니다.</span>
  </div>
  <header class="ph">
    <div class="ph-logo">주간보고 <span>출력</span></div>
    <div class="ph-right">
      <div class="ph-title" th:text="${printTitle}">주간보고</div>
      <div class="ph-meta" th:text="|${printOwner} · ${weekLabel} (${weekPeriod})|">대상 · 주차</div>
      <div class="confirmed" th:if="${confirmed}">확정됨</div>
    </div>
  </header>

  <th:block th:if="${printScope == 'admin'}">
    <div class="empty" th:if="${adminItems == null or adminItems.isEmpty()}">최종 제출된 팀 보고가 없습니다.</div>
    <section th:each="teamEntry, teamStat : ${adminItems}" th:class="${teamStat.last ? 'team-block' : 'team-block team-break'}">
      <div class="team-hd">
        <span th:text="${teamEntry.key.name}">팀명</span>
        <span class="team-badge">최종 제출</span>
      </div>
      <th:block th:each="status : ${statuses}" th:with="rows=${teamEntry.value.get(status)}, rowCount=${rows == null ? 0 : #lists.size(rows)}">
        <div th:class="${status.name() == 'NEW' ? 'sec-block new' : (status.name() == 'CONTINUE' ? 'sec-block cont' : 'sec-block done')}">
          <div class="sec-hd">
            <span th:text="${status.name() == 'NEW' ? '신규' : (status.name() == 'CONTINUE' ? '계속' : '완료')}">상태</span>
            <span class="sec-cnt" th:text="${rowCount}">0</span>
          </div>
          <div class="empty" th:if="${rowCount == 0}">등록된 항목이 없습니다.</div>
          <table th:if="${rowCount > 0}">
            <thead>
            <tr><th style="width:72px">담당자</th><th>추진 내용</th><th style="width:96px">완료 예정일</th><th style="width:72px">주기</th></tr>
            </thead>
            <tbody>
            <th:block th:each="item : ${rows}">
              <tr>
                <td><b th:text="${item.memberName}">담당자</b></td>
                <td><th:block th:replace="~{report/project-source :: content(${item}, false)}"></th:block></td>
                <td th:text="${item.dueDate != null ? item.dueDate : '-'}">-</td>
                <td th:text="${item.cycle != null and !#strings.isEmpty(item.cycle) ? item.cycle : '-'}">-</td>
              </tr>
              <tr class="det-row" th:each="detail : ${item.details}">
                <td></td>
                <td class="det-cell" th:text="|ㄴ ${detail.text}|">세부 항목</td>
                <td th:text="${detail.dueDate != null ? detail.dueDate : '-'}">-</td>
                <td th:text="${detail.cycle != null and !#strings.isEmpty(detail.cycle) ? detail.cycle : '-'}">-</td>
              </tr>
            </th:block>
            </tbody>
          </table>
        </div>
      </th:block>
    </section>
  </th:block>

  <th:block th:unless="${printScope == 'admin'}">
    <th:block th:each="status : ${statuses}" th:with="rows=${items.get(status)}, rowCount=${rows == null ? 0 : #lists.size(rows)}, showOwner=${printScope == 'team'}">
      <section th:class="${status.name() == 'NEW' ? 'sec-block new' : (status.name() == 'CONTINUE' ? 'sec-block cont' : 'sec-block done')}">
        <div class="sec-hd">
          <span th:text="${status.name() == 'NEW' ? '신규' : (status.name() == 'CONTINUE' ? '계속' : '완료')}">상태</span>
          <span class="sec-cnt" th:text="${rowCount}">0</span>
        </div>
        <div class="empty" th:if="${rowCount == 0}">등록된 항목이 없습니다.</div>
        <table th:if="${rowCount > 0}">
          <thead>
          <tr>
            <th th:if="${showOwner}" style="width:72px">담당자</th>
            <th>추진 내용</th>
            <th style="width:96px">완료 예정일</th>
            <th style="width:72px">주기</th>
          </tr>
          </thead>
          <tbody>
          <th:block th:each="item : ${rows}">
            <tr>
              <td th:if="${showOwner}"><b th:text="${item.memberName}">담당자</b></td>
              <td><th:block th:replace="~{report/project-source :: content(${item}, false)}"></th:block></td>
              <td th:text="${item.dueDate != null ? item.dueDate : '-'}">-</td>
              <td th:text="${item.cycle != null and !#strings.isEmpty(item.cycle) ? item.cycle : '-'}">-</td>
            </tr>
            <tr class="det-row" th:each="detail : ${item.details}">
              <td th:if="${showOwner}"></td>
              <td class="det-cell" th:text="|ㄴ ${detail.text}|">세부 항목</td>
              <td th:text="${detail.dueDate != null ? detail.dueDate : '-'}">-</td>
              <td th:text="${detail.cycle != null and !#strings.isEmpty(detail.cycle) ? detail.cycle : '-'}">-</td>
            </tr>
          </th:block>
          </tbody>
        </table>
      </section>
    </th:block>
  </th:block>

  <footer class="footer">
    <span>오피스시스템 주간보고 출력</span>
    <span th:text="|출력일 ${#temporals.format(printDate, 'yyyy. MM. dd')}|">출력일</span>
  </footer>
</div>
</body>
</html>
