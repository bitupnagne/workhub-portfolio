<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">팀원 현황 · 취합</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/img/AppLogoMini.svg}">
  <link rel="stylesheet" th:href="@{/css/worksystem.css}">
  <!-- 페이지 이동 화면 전환 오류 정리 — 첫 화면 그리기 전에 실행돼야 해서 head 에 둔다 -->
  <script th:src="@{/js/worksystem-view-transition.js}"></script>
  <link rel="stylesheet" th:href="@{/css/worksystem-project-report.css}">
</head>
<body>
<div class="app">
  <div th:replace="~{fragments/app :: sidebar}"></div>
  <main>
    <div th:replace="~{fragments/app :: topbar}"></div>
    <div class="content">
      <div class="weekly-report-root team-report-root" data-sort-root th:data-sort-key="${'team-' + weekKey}" data-ws-query-contract="report-week-v1" data-ws-query-path="self" data-ws-query-params="week" data-ws-query-region="report-body">
        <div class="banner ok" th:if="${message}" th:text="${message}"></div>
        <div class="banner err" th:if="${error}" th:text="${error}"></div>
        <div class="submit-banner banner-confirmed" th:if="${confirmed}">확정된 주간보고입니다.</div>
        <div class="submit-banner banner-ok" th:if="${!confirmed and teamSubmitted}">팀 보고가 최종 제출되었습니다. 주간보고 관리자에서 취합 중입니다.</div>

        <div class="stats-grid">
          <div class="stat-card sc-grad"><div class="stat-label">팀원 수</div><div class="stat-value sv-grad" th:text="${memberCount}">0</div><span class="stat-tag st-grad">전체</span></div>
          <div class="stat-card sc-green"><div class="stat-label">제출 완료</div><div class="stat-value sv-green" th:text="${submittedMemberCount}">0</div><span class="stat-tag st-green">완료</span></div>
          <div class="stat-card sc-red"><div class="stat-label">미제출</div><div class="stat-value sv-red" th:text="${memberCount - submittedMemberCount}">0</div><span class="stat-tag st-red">미제출</span></div>
          <div class="stat-card sc-blue"><div class="stat-label">취합 항목 수</div><div class="stat-value sv-blue" th:text="${totalCount}">0</div><span class="stat-tag st-blue">항목</span></div>
        </div>

        <div class="action-bar">
          <div class="action-left"></div>
          <a class="btn-pdf" th:href="@{/report/print(scope='team', week=${weekKey})}" target="_blank" rel="noopener">PDF 저장</a>
          <form th:if="${canEditTeamReport and !teamSubmitted}" th:action="@{/report/team-submit}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input type="hidden" name="weekKey" th:value="${weekKey}">
            <button class="btn-save" type="submit">최종 제출</button>
          </form>
          <form th:if="${currentUser.teamLeader and teamSubmitted and !confirmed}" th:action="@{/report/team-recall}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input type="hidden" name="weekKey" th:value="${weekKey}">
            <button class="btn-recall" type="submit">회수</button>
          </form>
        </div>

        <div class="sort-control-row" th:if="${canEditTeamReport}">
          <button class="btn-sort" type="button" data-toggle-sort data-label-off="순서변경" data-label-on="순서변경 완료">순서변경</button>
        </div>

        <div class="chip-row-label">팀원 제출 현황</div>
        <div class="chip-row">
          <span th:each="m : ${members}" th:class="${m.submitted} ? 'm-chip chip-ok' : 'm-chip chip-ng'">
            <span th:class="${m.submitted} ? 'chip-dot cdot-ok' : 'chip-dot cdot-ng'"></span>
            <span th:text="${m.name}">데모 사용자 502</span>
            <span class="chip-sub" th:text="${m.submitted ? '제출완료' : '미제출'}">제출완료</span>
          </span>
        </div>

        <section class="section-block" th:each="entry : ${items}">
          <div class="section-header no-caret">
            <div class="section-left">
              <span th:class="${entry.key.name() == 'NEW' ? 'sdot sdot-new' : (entry.key.name() == 'CONTINUE' ? 'sdot sdot-cont' : 'sdot sdot-done')}"></span>
              <span class="sname" th:text="${entry.key.label}">신규</span>
              <span th:class="${entry.key.name() == 'NEW' ? 'scnt scnt-new' : (entry.key.name() == 'CONTINUE' ? 'scnt scnt-cont' : 'scnt scnt-done')}" th:text="${#lists.size(entry.value)}">0</span>
              <span class="sort-hint">
                <span class="sort-hint-normal">제출완료 팀원만 · 이름순 + 완료일↓</span>
                <span class="sort-hint-active">순서변경 모드 - 위아래 이동 및 섹션 변경 가능</span>
              </span>
            </div>
          </div>
          <table class="rt">
            <thead><tr><th>#</th><th class="col-o">담당자</th><th class="col-c">추진 내용</th><th class="col-d">완료(예정)일</th><th class="col-cy">주기</th><th class="col-a sort-only">순서 / 섹션</th></tr></thead>
            <tbody>
            <!-- [UX36] sort-only(6번째) 열은 평소 display:none — colspan 6이면 fixed 레이아웃에서 유령 열이 생겨 표가 깨진다 -->
            <tr class="empty-tr" th:if="${#lists.isEmpty(entry.value)}"><td colspan="5">등록된 항목이 없습니다</td></tr>
            <th:block th:each="item, stat : ${entry.value}">
              <tr class="mr" th:classappend="${!stat.first} ? ' name-sep'"
                  th:data-report-row="${'item-' + item.id}">
                <td th:text="${stat.count}">1</td>
                <td><span class="owner-chip"><span th:text="${item.memberName}">담당자</span></span></td>
                <td><th:block th:replace="~{report/project-source :: content(${item}, true)}"></th:block></td>
                <td><span class="date-mono" th:text="${item.dueDate != null ? item.dueDate : '—'}"></span></td>
                <td><span class="cycle-badge" th:text="${item.cycle != null and !#strings.isEmpty(item.cycle) ? item.cycle : '—'}"></span></td>
                <td class="sort-only" th:if="${canEditTeamReport}">
                  <div class="sort-actions compact-sort-actions">
                    <div class="move-group">
                      <form class="row-action-form" th:action="@{/report/team/item/move}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <input type="hidden" name="weekKey" th:value="${weekKey}">
                        <input type="hidden" name="itemId" th:value="${item.id}">
                        <input type="hidden" name="direction" value="-1">
                        <button class="move-btn" type="submit" aria-label="위로"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 12V4"></path><path d="M4.5 7.5 8 4l3.5 3.5"></path></svg></button>
                      </form>
                      <form class="row-action-form" th:action="@{/report/team/item/move}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <input type="hidden" name="weekKey" th:value="${weekKey}">
                        <input type="hidden" name="itemId" th:value="${item.id}">
                        <input type="hidden" name="direction" value="1">
                        <button class="move-btn" type="submit" aria-label="아래로"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 4v8"></path><path d="M4.5 8.5 8 12l3.5-3.5"></path></svg></button>
                      </form>
                    </div>
                    <form th:if="${!item.projectLinked}" class="row-action-form status-form" th:action="@{/report/team/item/status}" method="post">
                      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                      <input type="hidden" name="weekKey" th:value="${weekKey}">
                      <input type="hidden" name="itemId" th:value="${item.id}">
                      <select class="sort-select compact-sort-select" name="status" aria-label="섹션 이동" data-auto-submit data-no-search-select="true">
                        <option th:each="targetStatus : ${statuses}" th:value="${targetStatus}" th:selected="${targetStatus == item.status}" th:text="${targetStatus.label}">신규</option>
                      </select>
                    </form>
                  </div>
                </td>
              </tr>
              <tr class="det-row" th:each="detail : ${item.details}">
                <td></td><td></td><td class="det-content"><span class="det-icon">○</span><span th:text="${detail.text}">세부</span></td><td><span class="date-mono" th:text="${detail.dueDate != null ? detail.dueDate : '—'}"></span></td><td><span class="cycle-badge" th:text="${detail.cycle != null and !#strings.isEmpty(detail.cycle) ? detail.cycle : '—'}"></span></td>
                <td class="sort-only" th:if="${canEditTeamReport}"></td>
              </tr>
            </th:block>
            </tbody>
          </table>
        </section>
      </div>
    </div>
  </main>
</div>
<script th:src="@{/js/worksystem-weekly-report.js}"></script>
<script th:src="@{/js/worksystem-report-ajax.js}"></script>
</body>
</html>
