<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">전체 현황 · 취합</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/img/AppLogoMini.svg}">
  <link rel="stylesheet" th:href="@{/css/worksystem.css}">
  <!-- 페이지 이동 화면 전환 오류 정리 — 첫 화면 그리기 전에 실행돼야 해서 head 에 둔다 -->
  <script th:src="@{/js/worksystem-view-transition.js}"></script>
  <link rel="stylesheet" th:href="@{/css/worksystem-project-report.css}">
</head>
<body>
<div class="app">
  <div th:replace="~{fragments/app :: sidebar}"></div>
  <main>
    <div th:replace="~{fragments/app :: topbar}"></div>
    <div class="content">
      <div class="weekly-report-root admin-report-root" data-sort-root th:data-sort-key="${'admin-' + weekKey}" data-ws-query-contract="report-week-v1" data-ws-query-path="self" data-ws-query-params="week" data-ws-query-region="report-body">
        <div class="banner ok" th:if="${message}" th:text="${message}"></div>
        <div class="banner err" th:if="${error}" th:text="${error}"></div>
        <div class="submit-banner banner-confirmed" th:if="${confirmed}">이번 주 주간보고가 확정되었습니다.</div>

        <div class="stats-grid">
          <div class="stat-card sc-grad"><div class="stat-label">전체 팀</div><div class="stat-value sv-grad" th:text="${teamCount}">0</div><span class="stat-tag st-grad">전체</span></div>
          <div class="stat-card sc-green"><div class="stat-label">최종제출</div><div class="stat-value sv-green" th:text="${submittedTeamCount}">0</div><span class="stat-tag st-green">완료</span></div>
          <div class="stat-card sc-red"><div class="stat-label">미제출</div><div class="stat-value sv-red" th:text="${unsubmittedTeamCount}">0</div><span class="stat-tag st-red">미제출</span></div>
          <div class="stat-card sc-blue"><div class="stat-label">전체 항목</div><div class="stat-value sv-blue" th:text="${adminItemCount}">0</div><span class="stat-tag st-blue">항목</span></div>
        </div>

        <div class="action-bar">
          <div class="action-left"></div>
          <button class="btn-sort" type="button" data-toggle-sort data-label-off="팀 순서변경" data-label-on="팀 순서변경 완료" th:if="${canEditAdminReport}">팀 순서변경</button>
          <a class="btn-pdf" th:href="@{/report/print(scope='admin', week=${weekKey})}" target="_blank" rel="noopener">PDF 저장</a>
          <form th:if="${canEditAdminReport and !confirmed}" th:action="@{/report/admin-confirm}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input type="hidden" name="weekKey" th:value="${weekKey}">
            <button class="btn-confirm" type="submit">주간보고 확정</button>
          </form>
          <form th:if="${canEditAdminReport and confirmed}" th:action="@{/report/admin-cancel}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input type="hidden" name="weekKey" th:value="${weekKey}">
            <button class="btn-cancel-confirm" type="submit">확정 취소</button>
          </form>
        </div>

        <div class="team-status-grid">
          <div th:each="team : ${teams}" th:with="submitted=${teamSubmittedById[team.id] == true}"
               th:class="${submitted ? 'team-status-card tsc-ok' : 'team-status-card tsc-ng'}">
            <div class="tsc-name" th:text="${team.name}">팀</div>
            <span th:class="${submitted ? 'tsc-badge tscb-ok' : 'tsc-badge tscb-ng'}" th:text="${submitted ? '최종제출' : '미제출'}">상태</span>
            <div class="tsc-meta" th:text="|팀원 ${teamSubmittedMemberCountById[team.id]}/${teamMemberCountById[team.id]}명 · ${teamItemCountById[team.id]}개 항목|">팀원 0/0명 · 0개 항목</div>
          </div>
        </div>

        <div class="sec-title-row">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2 4h12M2 8h8M2 12h5"></path></svg>
          전체 보고서 취합
          <span class="sort-hint">
            <span class="sort-hint-normal" th:text="|최종제출 팀만 표시 · 총 ${adminItems.size()}팀|">최종제출 팀만 표시</span>
            <span class="sort-hint-active">순서변경 모드</span>
          </span>
        </div>

        <div class="submit-banner banner-warn" th:if="${adminItems.isEmpty()}">최종 제출된 팀 보고가 없습니다. 팀장이 최종 제출한 팀만 아래에 표시됩니다.</div>

        <section class="section-block vf-report-section" th:each="teamEntry : ${adminItems}" data-vf-section
                 th:data-section-key="${'admin-team-' + weekKey + '-' + teamEntry.key.id}"
                 th:data-report-row="${'team-' + teamEntry.key.id}">
          <div class="section-header" role="button" tabindex="0" data-section-toggle>
            <span class="section-left">
              <span class="sdot sdot-done"></span>
              <span class="sname" th:text="${teamEntry.key.name}">팀명</span>
              <span class="scnt scnt-done" th:text="${teamItemCountById[teamEntry.key.id]}">0</span>
              <span class="team-badge badge-ok">최종제출</span>
              <span class="section-tools sort-only" onclick="event.stopPropagation()" th:if="${canEditAdminReport}">
                <form class="row-action-form" th:action="@{/report/admin/team-order}" method="post">
                  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                  <input type="hidden" name="weekKey" th:value="${weekKey}">
                  <input type="hidden" name="teamId" th:value="${teamEntry.key.id}">
                  <input type="hidden" name="direction" value="-1">
                  <button class="move-btn" type="submit" aria-label="위로"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 12V4"></path><path d="M4.5 7.5 8 4l3.5 3.5"></path></svg></button>
                </form>
                <form class="row-action-form" th:action="@{/report/admin/team-order}" method="post">
                  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                  <input type="hidden" name="weekKey" th:value="${weekKey}">
                  <input type="hidden" name="teamId" th:value="${teamEntry.key.id}">
                  <input type="hidden" name="direction" value="1">
                  <button class="move-btn" type="submit" aria-label="아래로"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 4v8"></path><path d="M4.5 8.5 8 12l3.5-3.5"></path></svg></button>
                </form>
              </span>
            </span>
            <svg class="chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><polyline points="4,6 8,10 12,6"></polyline></svg>
          </div>

          <div class="section-body" data-section-body>
            <div class="admin-status-section" th:each="entry : ${teamEntry.value}">
              <div class="admin-status-header">
                <span th:class="${entry.key.name() == 'NEW' ? 'sdot sdot-new' : (entry.key.name() == 'CONTINUE' ? 'sdot sdot-cont' : 'sdot sdot-done')}"></span>
                <span th:text="${entry.key.label}">신규</span>
                <span th:class="${entry.key.name() == 'NEW' ? 'scnt scnt-new' : (entry.key.name() == 'CONTINUE' ? 'scnt scnt-cont' : 'scnt scnt-done')}" th:text="${#lists.size(entry.value)}">0</span>
              </div>
              <table class="rt">
                <thead><tr><th>#</th><th class="col-o">담당자</th><th class="col-c">추진 내용</th><th class="col-d">완료(예정)일</th><th class="col-cy">주기</th></tr></thead>
                <tbody>
                <tr class="empty-tr" th:if="${#lists.isEmpty(entry.value)}"><td colspan="5">항목 없음</td></tr>
                <th:block th:each="item, stat : ${entry.value}">
                  <tr class="mr" th:classappend="${!stat.first} ? ' name-sep'"
                      th:data-report-row="${'item-' + item.id}">
                    <td th:text="${stat.count}">1</td>
                    <td><span class="owner-chip"><span th:text="${item.memberName}">담당자</span></span></td>
                    <td><th:block th:replace="~{report/project-source :: content(${item}, true)}"></th:block></td>
                    <td><span class="date-mono" th:text="${item.dueDate != null ? item.dueDate : '—'}"></span></td>
                    <td><span class="cycle-badge" th:text="${item.cycle != null and !#strings.isEmpty(item.cycle) ? item.cycle : '—'}"></span></td>
                  </tr>
                  <tr class="det-row" th:each="detail : ${item.details}">
                    <td></td><td></td><td class="det-content"><span class="det-icon">○</span><span th:text="${detail.text}">세부</span></td><td><span class="date-mono" th:text="${detail.dueDate != null ? detail.dueDate : '—'}"></span></td><td><span class="cycle-badge" th:text="${detail.cycle != null and !#strings.isEmpty(detail.cycle) ? detail.cycle : '—'}"></span></td>
                  </tr>
                </th:block>
                </tbody>
              </table>
            </div>
          </div>
        </section>
      </div>
    </div>
  </main>
</div>
<script th:src="@{/js/worksystem-weekly-report.js}"></script>
<script th:src="@{/js/worksystem-report-ajax.js}"></script>
</body>
</html>
