<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">시차출근 신청</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/img/AppLogoMini.svg}">
  <link rel="stylesheet" th:href="@{/css/worksystem.css}">
  <!-- 페이지 이동 화면 전환 오류 정리 — 첫 화면 그리기 전에 실행돼야 해서 head 에 둔다 -->
  <script th:src="@{/js/worksystem-view-transition.js}"></script>
</head>
<body>
<div class="app">
  <div th:replace="~{fragments/app :: sidebar}"></div>
  <main>
    <div th:replace="~{fragments/app :: topbar}"></div>
    <div class="content admin-page">
      <div class="banner ok" th:if="${message}" th:text="${message}"></div>
      <div class="banner err" th:if="${error}" th:text="${error}"></div>

      <div class="route-alert" th:if="${routeAlert}" th:text="${routeAlert}"></div>
      <div class="doc-stamp-top" th:if="${routeAlert == null}">
        <div th:replace="~{fragments/approval :: stamp(${approvalPreview}, null, 'preview', ${applicantName}, ${applicantSignature}, null)}"></div>
      </div>

      <section class="form-panel">
        <div class="form-head">
          <div>
            <h2>시차출근 신청</h2>
          </div>
          <a class="rbtn" th:href="@{/hr/attendance(tab='flex')}">목록</a>
        </div>
        <form class="stack-form" th:action="@{/hr/flex-time/request}" method="post" data-approval-route-warning data-approval-doc-type="FLEX_TIME">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
          <label class="field">근무 조
            <select name="shiftGroup" required>
              <option value="" disabled selected>조를 선택하세요</option>
              <option th:each="group : ${shiftGroups}" th:value="${group.code}" th:text="${group.label}">A조</option>
            </select>
          </label>
          <div class="form-grid two">
            <label class="field">시작일
              <input type="date" name="startDate" required>
            </label>
            <label class="field">종료일
              <input type="date" name="endDate" required>
            </label>
          </div>
          <label class="field">신청 사유
            <textarea class="form-textarea" name="reason" rows="4" placeholder="시차출근이 필요한 사유를 입력하세요"></textarea>
          </label>
          <button class="btn primary block" type="submit"
                  th:disabled="${approvalRouteReady == false}"
                  th:title="${approvalRouteReady == false ? '결재선이 없어 신청할 수 없습니다.' : ''}">신청하기</button>
        </form>
      </section>

      <div class="doc-date-footer" th:text="${#temporals.format(#temporals.createToday(), 'yyyy년 MM월 dd일')}">2026년 05월 17일</div>
    </div>
  </main>
</div>
</body>
</html>
