<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">시간외 근무 신청</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/img/AppLogoMini.svg}">
  <link rel="stylesheet" th:href="@{/css/worksystem.css}">
  <!-- 페이지 이동 화면 전환 오류 정리 — 첫 화면 그리기 전에 실행돼야 해서 head 에 둔다 -->
  <script th:src="@{/js/worksystem-view-transition.js}"></script>
</head>
<body>
<div class="app">
  <div th:replace="~{fragments/app :: sidebar}"></div>
  <main>
    <div th:replace="~{fragments/app :: topbar}"></div>
    <div class="content admin-page">
      <div class="banner ok" th:if="${message}" th:text="${message}"></div>
      <div class="banner err" th:if="${error}" th:text="${error}"></div>

      <div class="route-alert" th:if="${routeAlert}" th:text="${routeAlert}"></div>
      <div class="doc-stamp-top" th:if="${routeAlert == null}">
        <div th:replace="~{fragments/approval :: stamp(${approvalPreview}, null, 'preview', ${applicantName}, ${applicantSignature}, null)}"></div>
      </div>

      <section class="form-panel">
        <div class="form-head">
          <div>
            <h2>시간외 근무 신청</h2>
          </div>
          <a class="rbtn" th:href="@{/hr/overtime}">목록</a>
        </div>
        <form class="stack-form" th:action="@{/hr/overtime/request}" method="post"
              data-approval-route-warning data-approval-doc-type="OVERTIME" data-overtime-week-check>
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
          <label class="field">근무일
            <input type="date" name="workDate" th:value="${workDate}" required>
          </label>
          <div class="form-grid two">
            <label class="field">시작 시각
              <input type="time" name="startTime" th:value="${startTime}" required>
            </label>
            <label class="field">종료 시각
              <input type="time" name="endTime" th:value="${endTime}" required>
            </label>
          </div>
          <p class="muted">종료 시각이 시작 시각보다 빠르면 <b>다음 날</b>로 봅니다(예: 22:00 ~ 01:00).
            야간 시간대는 <span th:text="|${#temporals.format(overtimeSetting.nightStart, 'HH:mm')} ~ ${#temporals.format(overtimeSetting.nightEnd, 'HH:mm')}|">22:00 ~ 06:00</span>입니다.</p>
          <p class="muted" data-overtime-break>휴게 시간은 입력하지 않고 자동으로 뺍니다. 4시간을 채우면 바로 퇴근할 수 있고,
            그 뒤 더 머문 시간부터 30분까지를 휴게로 봅니다(8시간은 1시간까지). 정산할 때는 실제 출퇴근 기록으로 다시 계산합니다.
            <b data-overtime-break-result></b></p>
          <label class="field">사유
            <textarea class="form-textarea" name="reason" rows="4" placeholder="시간외 근무가 필요한 업무를 적어 주세요" required></textarea>
          </label>
          <button class="btn primary block" type="submit"
                  th:disabled="${approvalRouteReady == false}"
                  th:title="${approvalRouteReady == false ? '결재선이 없어 신청할 수 없습니다.' : ''}">신청하기</button>
        </form>
      </section>
    </div>
  </main>
</div>
</body>
</html>
