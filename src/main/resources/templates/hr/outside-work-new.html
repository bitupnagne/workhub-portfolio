<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">외근 신청</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/img/AppLogoMini.svg}">
  <link rel="stylesheet" th:href="@{/css/worksystem.css}">
  <!-- 페이지 이동 화면 전환 오류 정리 — 첫 화면 그리기 전에 실행돼야 해서 head 에 둔다 -->
  <script th:src="@{/js/worksystem-view-transition.js}"></script>
</head>
<body>
<div class="app">
  <div th:replace="~{fragments/app :: sidebar}"></div>
  <main>
    <div th:replace="~{fragments/app :: topbar}"></div>
    <div class="content admin-page">
      <div class="banner ok" th:if="${message}" th:text="${message}"></div>
      <div class="banner err" th:if="${error}" th:text="${error}"></div>

      <div class="route-alert" th:if="${routeAlert}" th:text="${routeAlert}"></div>
      <div class="doc-stamp-top" th:if="${routeAlert == null}">
        <div th:replace="~{fragments/approval :: stamp(${approvalPreview}, null, 'preview', ${applicantName}, ${applicantSignature}, null)}"></div>
      </div>

      <section class="form-panel">
        <div class="form-head">
          <div>
            <h2>외근 신청</h2>
          </div>
          <a class="rbtn" th:href="@{/hr/outside-work}">목록</a>
        </div>
        <form class="stack-form" th:action="@{/hr/outside-work/request}" method="post"
              data-approval-route-warning data-approval-doc-type="OUTSIDE_WORK">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
          <label class="field">근무일
            <input type="date" name="workDate" th:value="${workDate}" required>
          </label>
          <div class="form-grid two">
            <label class="field">시작 시각
              <input type="time" name="outTime" required>
            </label>
            <label class="field">종료 시각
              <input type="time" name="endTime" th:value="${defaultEndTime}" required>
            </label>
          </div>
          <p class="muted">정해진 출근·퇴근 시각에 걸치면 결재 후 출퇴근이 유예되고, 아니면 결재 없이 바로 등록됩니다.</p>
          <label class="field">장소
            <input type="text" name="place" maxlength="200" placeholder="예: 고객사 본사" required>
          </label>
          <label class="field">사유
            <textarea class="form-textarea" name="reason" rows="3" placeholder="외근 업무를 적어 주세요"></textarea>
          </label>
          <label class="field" th:if="${isApprover}">부재 중 대리승인자 <span class="muted">(선택)</span>
            <select name="delegateUserId">
              <option value="">지정 안 함</option>
              <option th:each="u : ${delegateCandidates}" th:value="${u.id}" th:selected="${u.id == lastDelegateId}"
                      th:text="|${u.name} (${u.teamName ?: '-'})|">홍길동</option>
            </select>
          </label>
          <button class="btn primary block" type="submit"
                  th:disabled="${approvalRouteReady == false}"
                  th:title="${approvalRouteReady == false ? '결재선이 없어 신청할 수 없습니다.' : ''}">신청하기</button>
        </form>
      </section>
    </div>
  </main>
</div>
</body>
</html>
