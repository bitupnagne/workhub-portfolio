<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">외근</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/img/AppLogoMini.svg}">
  <link rel="stylesheet" th:href="@{/css/worksystem.css}">
  <!-- 페이지 이동 화면 전환 오류 정리 — 첫 화면 그리기 전에 실행돼야 해서 head 에 둔다 -->
  <script th:src="@{/js/worksystem-view-transition.js}"></script>
</head>
<body>
<div class="app">
  <div th:replace="~{fragments/app :: sidebar}"></div>
  <main>
    <div th:replace="~{fragments/app :: topbar}"></div>
    <div class="content admin-page" data-ws-query-contract="hr-outside-work-v1" data-ws-query-path="self" data-ws-query-params="month" data-ws-query-context="default">
      <div class="banner ok" th:if="${message}" th:text="${message}"></div>
      <div class="banner err" th:if="${error}" th:text="${error}"></div>

      <div class="admin-title-row">
        <div><h2>외근</h2></div>
        <div class="page-actions" data-ws-query-state="month-nav">
          <a class="rbtn" th:href="@{/hr/outside-work(month=${monthPrev})}" aria-label="이전 달"><svg th:replace="~{fragments/icons :: i('chevron_left')}"></svg></a>
          <strong th:text="${outsideMonthLabel}">2026년 11월</strong>
          <a class="rbtn" th:href="@{/hr/outside-work(month=${monthNext})}" aria-label="다음 달"><svg th:replace="~{fragments/icons :: i('chevron_right')}"></svg></a>
          <a class="btn primary" th:href="@{/hr/outside-work/new}" data-app-form data-app-form-label="외근 신청"><svg th:replace="~{fragments/icons :: i('add')}"></svg> 외근 신청</a>
        </div>
      </div>

      <div data-tabs="tab" data-ws-query-region="outside-rows">
        <div class="ws-tabs" role="tablist">
          <button type="button" data-tab="mine" role="tab">내 신청</button>
          <button type="button" data-tab="members" role="tab" th:if="${!#lists.isEmpty(memberRequests)}">팀원</button>
        </div>
        <div data-tab-panel="mine" role="tabpanel">
          <section class="section-block">
            <div class="table-scroll">
              <table class="rt board-table">
                <thead><tr><th>근무일</th><th>시간</th><th>근태</th><th>장소</th><th>사유</th><th>상태</th><th></th></tr></thead>
                <tbody>
                <tr class="empty-tr" th:if="${#lists.isEmpty(myRequests)}"><td colspan="7">이 달에 신청한 외근이 없습니다.</td></tr>
                <tr th:each="r : ${myRequests}">
                  <td th:text="${r.workDate}">2026-11-24</td>
                  <td th:text="${r.timeText}">14:00 ~ 18:00</td>
                  <td class="muted" th:text="${outsideEffects[r.id]}">퇴근 유예</td>
                  <td th:text="${r.place}">고객사</td>
                  <td class="muted" th:text="${r.reason ?: '-'}">-</td>
                  <td><span class="status-pill" th:classappend="${r.status.name() == 'APPROVED'} ? ' ok' : (${r.status.name() == 'REJECTED'} ? ' danger' : '')" th:text="${r.statusLabel}">승인 대기</span></td>
                  <td>
                    <a class="rbtn" th:href="@{/hr/outside-work/{id}/document(id=${r.id})}">문서</a>
                    <form th:if="${r.pending or (r.status.name() == 'APPROVED' and outsideEffects[r.id] == '근태 변화 없음')}" th:action="@{/hr/outside-work/{id}/cancel(id=${r.id})}" method="post" style="display:inline"
                          data-confirm-message="외근 신청을 회수하시겠습니까?" data-confirm-ok="회수">
                      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                      <button class="rbtn" type="submit">회수</button>
                    </form>
                  </td>
                </tr>
                </tbody>
              </table>
            </div>
          </section>
        </div>
        <div data-tab-panel="members" role="tabpanel" hidden th:if="${!#lists.isEmpty(memberRequests)}">
          <section class="section-block">
            <div class="table-scroll">
              <table class="rt board-table">
                <thead><tr><th>팀</th><th>이름</th><th>근무일</th><th>시간</th><th>근태</th><th>장소</th><th>상태</th><th></th></tr></thead>
                <tbody>
                <tr th:each="r : ${memberRequests}">
                  <td th:text="${r.teamName ?: '-'}">팀</td>
                  <td th:text="${r.memberName}">이름</td>
                  <td th:text="${r.workDate}">2026-11-24</td>
                  <td th:text="${r.timeText}">14:00 ~ 18:00</td>
                  <td class="muted" th:text="${outsideEffects[r.id]}">퇴근 유예</td>
                  <td th:text="${r.place}">고객사</td>
                  <td><span class="status-pill" th:classappend="${r.status.name() == 'APPROVED'} ? ' ok' : (${r.status.name() == 'REJECTED'} ? ' danger' : '')" th:text="${r.statusLabel}">승인 대기</span></td>
                  <td><a class="rbtn" th:href="@{/hr/outside-work/{id}/document(id=${r.id})}">문서</a></td>
                </tr>
                </tbody>
              </table>
            </div>
          </section>
        </div>
      </div>
    </div>
  </main>
</div>
</body>
</html>
