<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">연차 신청</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/img/AppLogoMini.svg}">
  <link rel="stylesheet" th:href="@{/css/worksystem.css}">
  <!-- 페이지 이동 화면 전환 오류 정리 — 첫 화면 그리기 전에 실행돼야 해서 head 에 둔다 -->
  <script th:src="@{/js/worksystem-view-transition.js}"></script>
</head>
<body>
<div class="app">
  <div th:replace="~{fragments/app :: sidebar}"></div>
  <main>
    <div th:replace="~{fragments/app :: topbar}"></div>
    <div class="content admin-page">
      <div class="banner ok" th:if="${message}" th:text="${message}"></div>
      <div class="banner err" th:if="${error}" th:text="${error}"></div>

      <div class="route-alert" th:if="${routeAlert}" th:text="${routeAlert}"></div>
      <div class="doc-stamp-top" th:if="${routeAlert == null}">
        <div th:replace="~{fragments/approval :: stamp(${approvalPreview}, null, 'preview', ${applicantName}, ${applicantSignature}, null)}"></div>
      </div>

      <!-- 연차는 연도별로 부여·집계된다. 어느 해 숫자인지 라벨에 박아 두고, 날짜를 고르면
           그 해 값으로 갈아끼운다(worksystem-leave-preview.js) — 내년 날짜를 골랐는데
           올해 잔여가 떠 있으면 두 숫자가 서로 다른 해를 가리키게 된다. -->
      <div class="stats-grid stats-grid-compact">
        <div class="stat-card sc-green">
          <div class="stat-label"><span data-lp-year th:text="${year}">2026</span>년 잔여 연차</div>
          <div class="stat-value sv-green" data-lp-remaining th:text="${balance.remainingDays}">0</div>
          <span class="stat-tag st-green">일</span>
        </div>
        <div class="stat-card sc-grad">
          <div class="stat-label"><span data-lp-year th:text="${year}">2026</span>년 발생 연(월)차</div>
          <div class="stat-value sv-grad" data-lp-entitlement th:text="${leaveEntitlementSummary.entitlementText}">15</div>
          <span class="stat-tag st-grad" th:text="${leaveEntitlementSummary.tenureText}">근속</span>
        </div>
      </div>
      <p class="muted" data-lp-accrual-note hidden style="margin:-4px 0 10px;font-size:12px"></p>

      <section class="form-panel">
        <div class="form-head">
          <div>
            <h2>휴가 신청</h2>
          </div>
          <a class="rbtn" th:href="@{/hr/attendance(tab='leave')}">목록</a>
        </div>
        <form class="stack-form" th:action="@{/hr/leave/request}" method="post" data-approval-route-warning data-approval-doc-type="LEAVE"
              data-leave-preview th:data-preview-url="@{/hr/leave/preview-days}">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
          <div class="form-grid two">
            <label class="field">휴가 종류
              <select name="type" required>
                <!-- [C2] DB 정의 기반 — 사용 중지 종류 제외, 증빙 필요 표기 -->
                <option th:each="type : ${leaveTypes}" th:value="${type.code}"
                        th:text="${type.label + (type.evidenceRequired ? ' (증빙 필요)' : '')}">연차</option>
              </select>
            </label>
            <label class="field">신청 연도
              <input name="yearDisplay" th:value="${year}" disabled>
            </label>
            <!-- [UX40] 정정 화면 '휴가로 처리' 진입 시 대상 일자 프리필 -->
            <label class="field">시작일
              <input type="date" name="startDate" th:value="${prefillStart}" required>
            </label>
            <label class="field">종료일
              <input type="date" name="endDate" th:value="${prefillEnd}" required>
            </label>
          </div>
          <div class="leave-preview" data-lp-box hidden>
            <div class="leave-preview-days">
              <span>차감 예정</span><b data-lp-days>-</b>
              <span data-lp-after-wrap hidden>· 차감 후 잔여 <b data-lp-after>-</b></span>
              <span class="leave-preview-hint">주말·회사 휴무일은 차감에서 제외됩니다.</span>
            </div>
            <ul class="leave-preview-warns" data-lp-warns></ul>
          </div>
          <label class="field">신청 사유
            <textarea class="form-textarea" name="reason" rows="4" placeholder="업무 인수인계, 연락 가능 여부 등 필요한 내용을 입력하세요"></textarea>
          </label>
          <label class="field" th:if="${isApprover}">부재 중 대리승인자 <span class="muted">(선택)</span>
            <select name="delegateUserId">
              <option value="">지정 안 함</option>
              <option th:each="u : ${delegateCandidates}" th:value="${u.id}" th:selected="${u.id == lastDelegateId}"
                      th:text="|${u.name} (${u.teamName ?: '-'})|">홍길동</option>
            </select>
          </label>
          <button class="btn primary block" type="submit"
                  th:disabled="${approvalRouteReady == false}"
                  th:title="${approvalRouteReady == false ? '결재선이 없어 신청할 수 없습니다.' : ''}">신청하기</button>
        </form>
      </section>

      <!-- [A8] 우리 팀 부재 현황(이번 달~다음 달) — 신청 일자 겹침 판단 참고 -->
      <section class="form-panel" th:if="${!#lists.isEmpty(teamAbsences)}">
        <div class="form-head">
          <div>
            <h2>우리 팀 부재 현황</h2>
            <p>이번 달~다음 달 승인된 팀원 휴가·출장입니다. 겹치는 날짜를 피해 신청하면 결재가 수월합니다.</p>
          </div>
        </div>
        <div class="chip-row compact-list">
          <span class="m-chip" th:each="ab : ${teamAbsences}">
            <b th:text="${ab.memberName}">이름</b>
            <span th:text="|${ab.label} · ${ab.startDate}${ab.startDate != ab.endDate ? ' ~ ' + ab.endDate : ''}|">종류 · 기간</span>
          </span>
        </div>
      </section>

      <div class="doc-date-footer" th:text="${#temporals.format(#temporals.createToday(), 'yyyy년 MM월 dd일')}">2026년 05월 17일</div>
    </div>
  </main>
</div>
</body>
</html>
