<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">휴직 신청</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/img/AppLogoMini.svg}">
  <link rel="stylesheet" th:href="@{/css/worksystem.css}">
</head>
<body>
<div class="app">
  <div th:replace="~{fragments/app :: sidebar}"></div>
  <main>
    <div th:replace="~{fragments/app :: topbar}"></div>
    <div class="content admin-page">
      <div class="banner ok" th:if="${message}" th:text="${message}"></div>
      <div class="banner err" th:if="${error}" th:text="${error}"></div>

      <div class="route-alert" th:if="${routeAlert}" th:text="${routeAlert}"></div>
      <div class="doc-stamp-top" th:if="${routeAlert == null}">
        <div th:replace="~{fragments/approval :: stamp(${approvalPreview}, null, 'preview', ${applicantName}, ${applicantSignature}, null)}"></div>
      </div>

      <section class="form-panel">
        <div class="form-head">
          <div>
            <h2>휴직 신청</h2>
            <p>승인되면 신청 기간 동안 재직상태가 <b>휴직</b>이 됩니다. 휴직 기간에는 출근 처리와 휴가 신청이 되지 않고,
              일별 근태에 '휴직'으로 표시됩니다.</p>
          </div>
          <a class="rbtn" th:href="@{/hr/loa}">목록</a>
        </div>
        <form class="stack-form" th:action="@{/hr/loa/request}" method="post"
              data-approval-route-warning data-approval-doc-type="LOA">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
          <label class="field">휴직 종류
            <select name="type" required>
              <option value="" disabled selected>종류를 선택하세요</option>
              <option th:each="t : ${loaTypes}" th:value="${t.code}"
                      th:text="${t.label + ' — ' + t.treatmentLabel}">육아휴직</option>
            </select>
          </label>
          <!-- 연차가 깎이는지 아닌지는 신청 전에 알아야 할 정보다. -->
          <p class="muted" style="margin:-4px 0 8px;font-size:12px">
            <b>육아휴직 · 업무상 부상·질병</b>은 법이 출근한 것으로 보아 연차가 줄지 않습니다.
            그 밖의 휴직은 쉰 기간만큼 그 해 연차가 <b>비례해서 줄어듭니다</b>.
          </p>
          <div class="form-grid two">
            <label class="field">시작일
              <input type="date" name="startDate" required>
            </label>
            <label class="field">종료일 (복직 예정일)
              <input type="date" name="endDate">
            </label>
          </div>
          <p class="muted" style="margin:-4px 0 8px;font-size:12px">종료일을 비우면 <b>복직일 미정</b>으로 신청됩니다.</p>
          <label class="field">신청 사유
            <textarea class="form-textarea" name="reason" rows="4" placeholder="휴직이 필요한 사유를 입력하세요"></textarea>
          </label>
          <button class="btn primary block" type="submit"
                  th:disabled="${approvalRouteReady == false}"
                  th:title="${approvalRouteReady == false ? '결재선이 없어 신청할 수 없습니다.' : ''}">신청하기</button>
        </form>
      </section>

      <div class="doc-date-footer" th:text="${#temporals.format(#temporals.createToday(), 'yyyy년 MM월 dd일')}">2026년 05월 17일</div>
    </div>
  </main>
</div>
</body>
</html>
