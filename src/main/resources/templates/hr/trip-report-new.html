<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">출장 보고서 작성</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/img/AppLogoMini.svg}">
  <link rel="stylesheet" th:href="@{/css/worksystem.css}">
</head>
<body>
<div class="app">
  <div th:replace="~{fragments/app :: sidebar}"></div>
  <main>
    <div th:replace="~{fragments/app :: topbar}"></div>
    <div class="content admin-page">
      <div class="banner ok" th:if="${message}" th:text="${message}"></div>
      <div class="banner err" th:if="${error}" th:text="${error}"></div>

      <div class="route-alert" th:if="${routeAlert}" th:text="${routeAlert}"></div>
      <div class="doc-stamp-top" th:if="${routeAlert == null}">
        <div th:replace="~{fragments/approval :: stamp(${approvalPreview}, null, 'preview', ${applicantName}, ${applicantSignature}, null)}"></div>
      </div>

      <section class="form-panel">
        <div class="form-head">
          <div>
            <h2>출장 보고서 작성</h2>
            <p>결재 완료된 출장의 결과를 보고합니다. 경비가 신청과 달라졌다면 '금액 변동사항 존재'를 선택해 수정하고, 영수증 등 증빙 파일을 첨부하세요.</p>
          </div>
          <a class="rbtn" th:href="@{/hr/attendance(tab='trip')}">목록</a>
        </div>

        <div class="banner err" th:if="${rejectedReport != null and rejectedReport.status.name() == 'REJECTED'}"
             th:text="|이전 보고서가 반려되었습니다: ${rejectedReport.rejectedReason ?: '-'} — 다시 작성해 제출하세요.|"></div>

        <!-- 출장 신청 요약 -->
        <dl class="resume-table" style="margin-bottom:14px;">
          <dt>출장지</dt><dd th:text="${trip.destination}">부산지사</dd>
          <dt>기간</dt><dd><span class="date-mono" th:text="|${trip.startDate} ~ ${trip.endDate}|">기간</span></dd>
          <dt>목적</dt><dd class="resume-span" th:text="${trip.purpose ?: '-'}">목적</dd>
        </dl>

        <form class="stack-form" th:action="@{/hr/trips/{id}/report(id=${trip.id})}" method="post" enctype="multipart/form-data"
              data-trip-expense-form data-approval-route-warning data-approval-doc-type="TRIP_REPORT" data-report-form>
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

          <label class="field">출장 내용 (보고)
            <textarea class="form-textarea" name="content" rows="6" placeholder="출장 수행 내용, 결과, 특이사항을 입력하세요" required></textarea>
          </label>

          <div class="sub-section-title">경비 정산</div>
          <!-- 신청 당시 경비(읽기 전용) -->
          <div class="table-scroll">
            <table class="rt board-table">
              <thead><tr><th>항목</th><th>내용</th><th class="num">신청 당시 금액</th><th>비고</th></tr></thead>
              <tbody>
              <tr class="empty-tr" th:if="${#lists.isEmpty(tripExpenses)}"><td colspan="4">신청 당시 입력된 경비가 없습니다</td></tr>
              <tr th:each="e : ${tripExpenses}">
                <td th:text="${e.expenseType.label}">교통비</td>
                <td th:text="${e.description ?: '-'}">내용</td>
                <td class="num" th:text="${#numbers.formatInteger(e.amount, 0, 'COMMA')} + '원'">0원</td>
                <td th:text="${e.note ?: '-'}">비고</td>
              </tr>
              </tbody>
            </table>
          </div>

          <!-- [UX47] 신청 시와 동일 / 금액 변동 -->
          <div class="acn-alt" style="margin-top:10px;">
            <label class="check-label"><input type="radio" name="expenseChanged" value="false" checked data-exp-mode> 신청 시와 동일</label>
            <label class="check-label"><input type="radio" name="expenseChanged" value="true" data-exp-mode> 금액 변동사항 존재</label>
            <span class="muted" style="font-size:11px;">변동 선택 시 신청 경비가 복사되어 아래에서 수정할 수 있습니다.</span>
          </div>

          <!-- 변동 시 편집 영역(신청 경비 프리필) -->
          <div class="trip-expense-editor" data-report-expense-editor hidden>
            <div class="trip-expense-head">
              <span>항목</span><span>내용</span><span>금액</span><span>비고</span><span></span>
            </div>
            <div class="trip-expense-rows" data-expense-rows>
              <div class="trip-expense-row" data-expense-row th:each="e, st : ${tripExpenses}">
                <label class="te-field" data-te="항목">
                  <select data-expense-type required>
                    <option th:each="type : ${expenseTypes}" th:value="${type.name()}"
                            th:selected="${type == e.expenseType}" th:text="${type.label}">교통비</option>
                  </select>
                </label>
                <label class="te-field" data-te="내용"><input data-expense-description th:value="${e.description}" placeholder="예: KTX, 호텔, 식대"></label>
                <label class="te-field" data-te="금액"><input data-expense-amount type="number" min="0" step="1000" th:value="${e.amount}" placeholder="0" required></label>
                <label class="te-field" data-te="비고"><input data-expense-note th:value="${e.note}" placeholder="비고"></label>
                <button class="rbtn del" type="button" data-expense-remove>삭제</button>
              </div>
              <div class="trip-expense-row" data-expense-row th:if="${#lists.isEmpty(tripExpenses)}">
                <label class="te-field" data-te="항목">
                  <select data-expense-type required>
                    <option th:each="type : ${expenseTypes}" th:value="${type.name()}" th:text="${type.label}">교통비</option>
                  </select>
                </label>
                <label class="te-field" data-te="내용"><input data-expense-description placeholder="예: KTX, 호텔, 식대"></label>
                <label class="te-field" data-te="금액"><input data-expense-amount type="number" min="0" step="1000" placeholder="0" required></label>
                <label class="te-field" data-te="비고"><input data-expense-note placeholder="비고"></label>
                <button class="rbtn del" type="button" data-expense-remove>삭제</button>
              </div>
            </div>
            <button class="btn" type="button" data-expense-add>항목 추가</button>
            <div class="expense-total-grid">
              <div><span>교통비</span><strong data-expense-total="TRANSPORT">0원</strong></div>
              <div><span>숙박비</span><strong data-expense-total="LODGING">0원</strong></div>
              <div><span>식비</span><strong data-expense-total="MEAL">0원</strong></div>
              <div><span>일비</span><strong data-expense-total="DAILY">0원</strong></div>
              <div><span>기타</span><strong data-expense-total="ETC">0원</strong></div>
              <div class="expense-total-all"><span>총 합계</span><strong data-expense-grand-total>0원</strong></div>
            </div>
          </div>

          <label class="field">파일 추가 (영수증 등 증빙)
            <input type="file" name="files" accept="image/png,application/pdf" multiple>
            <span class="muted">PNG 또는 PDF, 파일당 10MB 이하 — 여러 개 선택 가능</span>
          </label>

          <button class="btn primary block" type="submit"
                  th:disabled="${approvalRouteReady == false}"
                  th:title="${approvalRouteReady == false ? '결재선이 없어 제출할 수 없습니다.' : ''}">보고서 제출 (결재 요청)</button>
        </form>
      </section>

      <div class="doc-date-footer" th:text="${#temporals.format(#temporals.createToday(), 'yyyy년 MM월 dd일')}">2026년 05월 17일</div>
    </div>
  </main>
</div>
<script th:src="@{/js/worksystem-trip-expenses.js}"></script>
<script th:src="@{/js/worksystem-trip-report.js}"></script>
</body>
</html>
