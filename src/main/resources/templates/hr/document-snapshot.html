<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">문서 스냅샷</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/img/AppLogoMini.svg}">
  <link rel="stylesheet" th:href="@{/css/worksystem.css}">
  <!-- 페이지 이동 화면 전환 오류 정리 — 첫 화면 그리기 전에 실행돼야 해서 head 에 둔다 -->
  <script th:src="@{/js/worksystem-view-transition.js}"></script>
</head>
<body class="document-popup-body">
  <main class="document-popup document-page">
      <div class="action-bar no-print">
        <button class="rbtn" type="button" onclick="window.close(); setTimeout(function(){ if (!window.closed) history.back(); }, 150);">닫기</button>
        <a class="btn" th:href="@{${downloadUrl}}">문서 다운로드</a>
        <button class="btn primary" type="button" onclick="window.print()">PDF 저장 / 인쇄</button>
      </div>
      <div class="no-print doc-approve-box" th:if="${postActionable}">
        <div class="dab-title">후결 처리</div>
        <p class="dab-help">대리승인된 결재칸을 원 결재자로 후결 승인합니다.</p>
        <form class="dab-form"
              th:action="@{/hr/documents/{type}/{id}/post-approve(type=${documentTypeName},id=${documentId})}"
              method="post"
              data-approval-confirm-form data-approval-action="후결" data-approval-needs-reason="false">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
          <input type="hidden" name="back"
                 th:value="${documentTypeName == 'LEAVE' or documentTypeName == 'LEAVE_CANCEL' ? '/hr/leave/' + documentId + '/document'
                           : (documentTypeName == 'TRIP' ? '/hr/trips/' + documentId + '/document'
                           : (documentTypeName == 'TRIP_REPORT' ? '/hr/trips/report/' + documentId + '/document'
                           : (documentTypeName == 'LOA' ? '/hr/loa/' + documentId + '/document'
                           : (documentTypeName == 'OUTSIDE_WORK' ? '/hr/outside-work/' + documentId + '/document'
                           : (documentTypeName == 'OVERTIME' ? '/hr/overtime/' + documentId + '/document'
                           : (documentTypeName == 'FLEX_TIME' ? '/hr/flex-time/' + documentId + '/document'
                           : '/hr/attendance/correction/' + documentId + '/document'))))))}">
          <button class="btn primary" type="submit">후결</button>
        </form>
      </div>
      <div class="snapshot-meta no-print">
        <span th:text="${snapshot.documentKind}">문서</span>
        <span th:text="|보관 시각 ${#temporals.format(snapshot.createdAt, 'yyyy-MM-dd HH:mm')}|">보관 시각</span>
        <span>완료 시점의 결재선과 문서 내용을 고정 보관합니다.</span>
      </div>
      <div class="print-page snapshot-page" th:utext="${snapshot.snapshotHtml}"></div>
  </main>
  <script th:src="@{/js/worksystem-icons.js}"></script>
  <script th:src="@{/js/worksystem-modal.js}"></script>
  <script th:src="@{/js/worksystem-approval-confirm.js}"></script>
</body>
</html>
