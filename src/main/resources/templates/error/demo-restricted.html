<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>공개 데모 안내 — WorkHub</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/img/AppLogoMini.svg}">
  <link rel="stylesheet" th:href="@{/css/worksystem.css}">
  <!-- 페이지 이동 화면 전환 오류 정리 — 첫 화면 그리기 전에 실행돼야 해서 head 에 둔다 -->
  <script th:src="@{/js/worksystem-view-transition.js}"></script>
</head>
<body class="ws-error-body">
  <main class="ws-error-card">
    <img class="ws-error-logo" th:src="@{/img/AppLogoMini.svg}" alt="">
    <h1>공개 데모에서 제한된 기능입니다</h1>
    <p th:text="${demoRestrictionMessage}"></p>
    <p>프로젝트 등록, 업무 담당자·진척도 관리, 인수인계와 주간보고는 계속 체험할 수 있습니다.</p>
    <div class="ws-error-actions">
      <a class="btn primary" th:href="@{/projects}">프로젝트 관리로</a>
      <a class="btn" th:href="@{/}">첫 화면으로</a>
    </div>
  </main>
</body>
</html>
