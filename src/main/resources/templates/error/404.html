<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>페이지를 찾을 수 없어요 — 오피스 시스템</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/img/AppLogoMini.svg}">
  <link rel="stylesheet" th:href="@{/css/worksystem.css}">
</head>
<body class="ws-error-body">
  <main class="ws-error-card">
    <img class="ws-error-logo" th:src="@{/img/AppLogoMini.svg}" alt="">
    <div class="ws-error-code">404</div>
    <h1>페이지를 찾을 수 없어요</h1>
    <p>주소가 잘못되었거나, 화면이 이동·삭제되었을 수 있습니다.</p>
    <div class="ws-error-actions">
      <a class="btn primary" href="/">첫 화면으로</a>
      <a class="btn" href="javascript:history.back()">이전 화면으로</a>
    </div>
  </main>
</body>
</html>
