<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">자료전송</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/img/AppLogoMini.svg}">
  <link rel="stylesheet" th:href="@{/css/worksystem.css}">
</head>
<body>
<div class="app">
  <div th:replace="~{fragments/app :: sidebar}"></div>
  <main>
    <div th:replace="~{fragments/app :: topbar}"></div>
    <div class="content admin-page" data-ws-query-contract="work-memos-list-v1" data-ws-query-path="self" data-ws-query-params="q box page" data-ws-query-context="default">
      <div class="banner ok" th:if="${message}" th:text="${message}"></div>
      <div class="banner err" th:if="${error}" th:text="${error}"></div>

      <div class="action-bar">
        <a class="btn primary" th:href="@{/work-memos/compose}">+ 새 자료전송</a>
        <span style="flex:1"></span>
        <span class="muted" style="font-size:12px">받은 미열람 <b th:text="${unreadReceived}" style="color:#ef4444">0</b></span>
      </div>

      <section class="section-block">
        <div class="section-header no-caret">
          <div class="section-left"><span class="sdot sdot-done"></span><span class="sname">검색 · 필터</span></div>
        </div>
        <form class="admin-filter-bar" th:action="@{/work-memos}" method="get" data-ws-query-filter="filter-0">
          <input class="admin-search-input" name="q" th:value="${query}" placeholder="제목 / 내용 / 보낸 사람 검색">
          <select name="box" aria-label="박스 선택">
            <option value="received" th:selected="${box == 'received'}">수신함</option>
            <option value="sent" th:selected="${box == 'sent'}">발신함</option>
            <option value="starred" th:selected="${box == 'starred'}">즐겨찾기</option>
          </select>
          <button class="btn primary" type="submit">조회</button>
          <a class="btn" th:href="@{/work-memos(box=${box})}" data-ws-query-reset="">초기화</a>
        </form>
      </section>

      <section class="section-block" data-ws-query-region="results">
        <div class="section-header no-caret">
          <div class="section-left">
            <span class="sdot sdot-new"></span>
            <span class="sname" th:switch="${box}">
              <span th:case="'sent'">발신함</span>
              <span th:case="'starred'">즐겨찾기</span>
              <span th:case="*">수신함</span>
            </span>
            <span class="scnt scnt-new" th:text="${totalCount}">0</span>
          </div>
        </div>
        <div class="notice-list">
          <div class="empty-search" th:if="${#lists.isEmpty(memos)}">표시할 자료전송이 없습니다.</div>
          <article class="notice-item"
                   th:each="m : ${memos}"
                   th:classappend="${box == 'received' and m.readAt == null} ? ' unread'">
            <div class="notice-main">
              <div class="notice-title" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
                <span th:if="${box == 'received' and m.readAt == null}"
                      style="background:#ef4444;color:#fff;font-size:10px;font-weight:900;padding:1px 6px;border-radius:4px">NEW</span>
                <span th:if="${m.starred}" style="color:#F59E0B;font-size:14px">★</span>
                <a th:href="@{|/work-memos/${m.id}|}" th:text="${m.title}" style="color:inherit;text-decoration:none">제목</a>
              </div>
              <div class="notice-body" th:text="${m.body}">내용</div>
              <div class="notice-meta">
                <span th:text="${m.senderName != null ? m.senderName : '시스템'}">보낸 사람</span>
                <span th:text="${#temporals.format(m.sentAt, 'yyyy.MM.dd HH:mm')}">시간</span>
                <span th:if="${m.attachments != null and !#lists.isEmpty(m.attachments)}" style="display:inline-flex;align-items:center">
                  <svg class="btn-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                  <span th:text="${#lists.size(m.attachments)}">0</span>
                </span>
              </div>
            </div>
            <div class="act-wrap">
              <a class="go-btn" th:href="@{|/work-memos/${m.id}|}">열기</a>
            </div>
          </article>
        </div>
      </section>
    </div>
  </main>
</div>
</body>
</html>
