<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">조직 추가</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/img/AppLogoMini.svg}">
  <link rel="stylesheet" th:href="@{/css/worksystem.css}">
  <!-- 페이지 이동 화면 전환 오류 정리 — 첫 화면 그리기 전에 실행돼야 해서 head 에 둔다 -->
  <script th:src="@{/js/worksystem-view-transition.js}"></script>
</head>
<body>
<div class="app">
  <div th:replace="~{fragments/app :: sidebar}"></div>
  <main>
    <div th:replace="~{fragments/app :: topbar}"></div>
    <div class="content admin-page">
      <div class="banner ok" th:if="${message}" th:text="${message}"></div>
      <div class="banner err" th:if="${error}" th:text="${error}"></div>

      <section class="form-panel">
        <div class="form-head">
          <div>
            <h2>조직 추가</h2>
          </div>
          <a class="rbtn" th:href="@{/admin/org}">목록</a>
        </div>
        <form class="stack-form" th:action="@{/admin/org/team}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
          <div class="form-grid two">
            <label class="field">조직 코드
              <input name="code" placeholder="예: MKT" required>
            </label>
            <label class="field">조직명
              <input name="name" required>
            </label>
            <label class="field">조직 유형
              <select name="nodeType">
                <option value="ROOT">대표/최상위</option>
                <option value="DIVISION">본부/실</option>
                <option value="TEAM" selected>팀/센터</option>
              </select>
            </label>
            <label class="field">상위 조직
              <select name="parentId">
                <option value="">상위 없음</option>
                <option th:each="node : ${organizationNodes}" th:value="${node.id}" th:text="${node.path}">상위 조직</option>
              </select>
            </label>
          </div>
          <button class="btn primary block" type="submit">추가</button>
        </form>
      </section>
    </div>
  </main>
</div>
</body>
</html>
