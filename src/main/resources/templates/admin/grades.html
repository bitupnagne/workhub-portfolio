<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">직급 관리</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/img/AppLogoMini.svg}">
  <link rel="stylesheet" th:href="@{/css/worksystem.css}">
  <!-- 페이지 이동 화면 전환 오류 정리 — 첫 화면 그리기 전에 실행돼야 해서 head 에 둔다 -->
  <script th:src="@{/js/worksystem-view-transition.js}"></script>
</head>
<body>
<div class="app">
  <div th:replace="~{fragments/app :: sidebar}"></div>
  <main>
    <div th:replace="~{fragments/app :: topbar}"></div>
    <div class="content admin-page" data-ws-query-contract="admin-grades-v1" data-ws-query-path="self" data-ws-query-params="page" data-ws-query-context="default">
      <div class="banner ok" th:if="${message}" th:text="${message}"></div>
      <div class="banner err" th:if="${error}" th:text="${error}"></div>

      <div class="admin-title-row">
        <div><h2>직급 관리</h2></div>
        <div class="page-actions">
          <form th:action="@{/admin/grades/bulk-assign}" method="post"
                data-confirm-message="직급이 없는 직원에게 조직도 기준으로 지정합니다 — 본부장 1급, 팀장 3급, 나머지 5급. 이미 지정된 직원은 바뀌지 않습니다."
                data-confirm-ok="일괄 지정">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button class="rbtn" type="submit">조직도 기준 일괄 지정</button>
          </form>
          <button class="rbtn" type="button" data-modal-open="#gradeUnits">단계별 단위</button>
          <button class="btn primary" type="button" data-modal-open="#gradeNew"><svg th:replace="~{fragments/icons :: i('add')}"></svg> 직급 추가</button>
        </div>
      </div>

      <section class="section-block">
        <div class="section-header no-caret">
          <div class="section-left">
            <span class="sname">직급</span>
            <span class="scnt" th:text="${#lists.size(grades)}">0</span>
          </div>
        </div>
        <div class="table-scroll">
          <table class="rt admin-data-table no-mcard">
            <thead>
            <tr>
              <th style="width:76px">순서</th>
              <th>직급</th>
              <th>상위 직급</th>
              <th style="width:90px">인원</th>
              <th style="width:70px">사용</th>
              <th style="width:70px"></th>
            </tr>
            </thead>
            <tbody>
            <tr class="empty-tr" th:if="${#lists.isEmpty(grades)}"><td colspan="7">등록된 직급이 없습니다.</td></tr>
            <tr class="mr" th:each="g : ${grades}" th:classappend="${!g.active} ? 'is-muted' : ''">
              <td class="grade-order">
                <form th:action="@{/admin/grades/{id}/move(id=${g.id})}" method="post">
                  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                  <button class="grade-move" type="submit" name="direction" value="up" aria-label="한 칸 위로"><svg th:replace="~{fragments/icons :: i('arrow_up')}"></svg></button>
                  <button class="grade-move" type="submit" name="direction" value="down" aria-label="한 칸 아래로"><svg th:replace="~{fragments/icons :: i('arrow_down')}"></svg></button>
                </form>
              </td>
              <td><span th:if="${g.depth > 0}" class="muted" th:text="${#strings.repeat('　', g.depth) + '└ '}">└ </span><b th:text="${g.name}">3급</b></td>
              <td class="muted" th:text="${g.parentId == null} ? '-' : ${g.pathName.substring(0, g.pathName.lastIndexOf(' › '))}">-</td>
              <td th:text="${g.hasChildren} ? |${g.userCount}명 (하위 ${g.descendantUserCount})| : |${g.userCount}명|">0명</td>
              <td th:text="${g.active ? '사용' : '미사용'}">사용</td>
              <td><button class="rbtn acc" type="button" th:data-modal-open="|#gradeEdit-${g.id}|">수정</button></td>
            </tr>
            </tbody>
          </table>
        </div>
      </section>

<!-- 직급 추가 -->
<div class="schedule-edit-modal" data-settings-modal data-modal-size="compact" id="gradeNew" hidden>
  <div class="schedule-edit-dialog compact" role="dialog" aria-modal="true" aria-labelledby="gradeNewTitle">
    <div class="schedule-edit-head"><strong id="gradeNewTitle">직급 추가</strong><button type="button" data-modal-close aria-label="닫기"><svg th:replace="~{fragments/icons :: i('close')}"></svg></button></div>
    <form th:action="@{/admin/grades}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <div class="schedule-edit-body">
        <label class="field">상위 직급
          <select name="parentId">
            <option value="">없음 (최상위)</option>
            <option th:each="p : ${grades}" th:value="${p.id}" th:text="${p.pathName}">3급</option>
          </select>
        </label>
        <label class="field">값<input name="value" required maxlength="50" placeholder="예: 3, 선임, A"></label>
        <div class="field">단위
          <div class="grade-unit-pick">
            <select name="unitMode">
              <option value="inherit">단계 기본</option>
              <option value="custom">직접 입력</option>
              <option value="none">없음</option>
            </select>
            <input name="unitLabel" maxlength="20" placeholder="직접 입력" aria-label="단위 직접 입력">
          </div>
        </div>
      </div>
      <div class="schedule-edit-foot"><button class="btn primary" type="submit">추가</button><button class="rbtn" type="button" data-modal-close>닫기</button></div>
    </form>
  </div>
</div>

<!-- 단계별 단위 -->
<div class="schedule-edit-modal" data-settings-modal data-modal-size="compact" id="gradeUnits" hidden>
  <div class="schedule-edit-dialog compact" role="dialog" aria-modal="true" aria-labelledby="gradeUnitsTitle">
    <div class="schedule-edit-head"><strong id="gradeUnitsTitle">단계별 단위</strong><button type="button" data-modal-close aria-label="닫기"><svg th:replace="~{fragments/icons :: i('close')}"></svg></button></div>
    <form th:action="@{/admin/grades/units}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <div class="schedule-edit-body">
        <label class="field" th:each="u : ${depthUnits}">
          <span th:text="|${u.level}단계${u.depth == 0 ? ' (최상위)' : ''}|">1단계</span>
          <input type="text" maxlength="20" th:name="|unit_${u.depth}|" th:value="${u.unit}" placeholder="예: 급, 호봉">
        </label>
      </div>
      <div class="schedule-edit-foot"><button class="btn primary" type="submit">저장</button><button class="rbtn" type="button" data-modal-close>닫기</button></div>
    </form>
  </div>
</div>

<!-- 직급 수정 -->
<th:block th:each="g : ${grades}">
  <div class="schedule-edit-modal" data-settings-modal data-modal-size="compact" th:id="|gradeEdit-${g.id}|" hidden>
    <div class="schedule-edit-dialog compact" role="dialog" aria-modal="true" th:aria-labelledby="|gradeEditTitle-${g.id}|">
      <div class="schedule-edit-head"><strong th:id="|gradeEditTitle-${g.id}|" th:text="|${g.pathName} 수정|">직급 수정</strong><button type="button" data-modal-close aria-label="닫기"><svg th:replace="~{fragments/icons :: i('close')}"></svg></button></div>
      <form th:id="|gf-${g.id}|" th:action="@{/admin/grades/{id}/update(id=${g.id})}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <input type="hidden" name="displayOrder" th:value="${g.displayOrder}">
        <div class="schedule-edit-body">
          <label class="field">상위 직급
            <select name="parentId"><option value="" th:selected="${g.parentId == null}">없음 (최상위)</option><option th:each="p : ${grades}" th:if="${p.id != g.id}" th:value="${p.id}" th:selected="${p.id == g.parentId}" th:text="${p.pathName}">3급</option></select>
          </label>
          <label class="field">값<input name="value" th:value="${g.gradeValue}" required maxlength="50"></label>
          <div class="field">단위
            <div class="grade-unit-pick">
              <select name="unitMode">
                <option value="inherit" th:selected="${g.unitLabel == null}">단계 기본</option>
                <option value="custom" th:selected="${g.unitLabel != null and !#strings.isEmpty(g.unitLabel)}">직접 입력</option>
                <option value="none" th:selected="${g.unitLabel != null and #strings.isEmpty(g.unitLabel)}">없음</option>
              </select>
              <input name="unitLabel" maxlength="20" th:value="${g.unitLabel}" placeholder="직접 입력" aria-label="단위 직접 입력">
            </div>
          </div>
          <label class="check-label switch-label"><input type="checkbox" name="active" value="true" th:checked="${g.active}"><span class="switch-ui" aria-hidden="true"></span>사용</label>
        </div>
      </form>
      <form th:id="|gd-${g.id}|" th:action="@{/admin/grades/{id}/delete(id=${g.id})}" method="post"
            data-confirm-message="이 직급을 삭제하시겠습니까?" data-confirm-ok="삭제" data-confirm-danger="true">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      </form>
      <div class="schedule-edit-foot">
        <button class="rbtn del" type="submit" th:form="|gd-${g.id}|" th:disabled="${g.descendantUserCount > 0 or g.hasChildren}"
                th:title="${g.hasChildren ? '하위 직급이 있어 삭제할 수 없습니다' : (g.descendantUserCount > 0 ? '지정된 직원이 있어 삭제할 수 없습니다' : '')}">삭제</button>
        <span class="foot-spacer"></span>
        <button class="btn primary" type="submit" th:form="|gf-${g.id}|">저장</button>
        <button class="rbtn" type="button" data-modal-close>닫기</button>
      </div>
    </div>
  </div>
</th:block>

    </div>
  </main>
</div>
<script th:src="@{/js/worksystem-settings-modal.js}"></script>
</body>
</html>
