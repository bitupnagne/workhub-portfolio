<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">결재 경로 관리</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/img/AppLogoMini.svg}">
  <link rel="stylesheet" th:href="@{/css/worksystem.css}">
  <!-- 페이지 이동 화면 전환 오류 정리 — 첫 화면 그리기 전에 실행돼야 해서 head 에 둔다 -->
  <script th:src="@{/js/worksystem-view-transition.js}"></script>
</head>
<body>
<div class="app">
  <div th:replace="~{fragments/app :: sidebar}"></div>
  <main>
    <div th:replace="~{fragments/app :: topbar}"></div>
    <div class="content admin-page" data-ws-query-contract="admin-approval-routes-v1" data-ws-query-path="self" data-ws-query-params="type page" data-ws-query-context="default">
      <div class="banner ok" th:if="${message}" th:text="${message}"></div>
      <div class="banner err" th:if="${error}" th:text="${error}"></div>

      <div class="admin-title-row" data-ws-query-state="type-heading">
        <div>
          <h2 th:text="|${docType.label} 결재 관리|">연차 결재 관리</h2>
          <p class="route-warn">아래는 설정된 경로(의도)입니다. 실제 결재선은 제출 시 조직도에서 결재자를 찾아 구성되며,
            해당 직책 리더가 없거나 신청자 본인·앞 단계와 같은 사람이면 그 단계는 자동 생략·통합됩니다.</p>
        </div>
        <a class="btn primary" th:href="@{/admin/approval-routes/chain(type=${docType.name()})}">경로 편집</a>
      </div>

      <nav class="document-tabs ws-segmented" aria-label="결재 종류 필터" data-ws-query-state="type-tabs">
        <a th:each="dt : ${documentTypes}"
           th:href="@{/admin/approval-routes(type=${dt.name()})}"
           th:classappend="${dt == docType} ? 'active'"
           th:attr="aria-current=${dt == docType ? 'page' : null}"
           th:text="|${dt.label} 결재|">연차 결재</a>
      </nav>

      <section class="section-block" data-ws-query-region="routes">
        <div class="section-header no-caret">
          <div class="section-left"><span class="sdot sdot-done"></span><span class="sname">결재 경로 목록</span><span class="scnt scnt-done" th:text="${#lists.size(routes)}">0</span></div>
        </div>
        <div class="table-scroll">
          <table class="rt admin-data-table">
            <thead><tr><th>신청자 직책</th><th>결재 체인</th><th>수신 부서</th><th>관리</th></tr></thead>
            <tbody>
            <tr class="empty-tr" th:if="${#lists.isEmpty(routes)}"><td colspan="4" th:text="|${docType.label} 결재 경로가 없습니다.|">결재 경로가 없습니다.</td></tr>
            <tr class="mr" th:each="rt : ${routes}">
              <td th:text="${rt.levelLabel}">팀원</td>
              <td>
                <span class="chain-summary">
                  <span class="chain-node" th:each="c, ci : ${rt.chain}">
                    <span th:text="${c}">팀장</span>
                    <span class="chain-arrow" th:unless="${ci.last}"><svg th:replace="~{fragments/icons :: i('chevron_right')}"></svg></span>
                  </span>
                </span>
              </td>
              <td th:text="${rt.receivers}">-</td>
              <td>
                <div class="act-wrap">
                  <a class="rbtn acc" data-edit-link th:href="@{/admin/approval-routes/chain(type=${docType.name()},level=${rt.level.name()},scopeTeamId=${rt.scopeTeamId})}">수정</a>
                </div>
              </td>
            </tr>
            </tbody>
          </table>
        </div>
      </section>
    </div>
  </main>
</div>
</body>
</html>
