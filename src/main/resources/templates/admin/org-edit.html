<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">조직 수정</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/img/AppLogoMini.svg}">
  <link rel="stylesheet" th:href="@{/css/worksystem.css}">
</head>
<body>
<div class="app">
  <div th:replace="~{fragments/app :: sidebar}"></div>
  <main>
    <div th:replace="~{fragments/app :: topbar}"></div>
    <div class="content admin-page">
      <div class="banner ok" th:if="${message}" th:text="${message}"></div>
      <div class="banner err" th:if="${error}" th:text="${error}"></div>

      <div class="admin-title-row">
        <div>
          <h2 th:text="|${node.name} 조직 수정|">조직 수정</h2>
          <p th:text="${node.path}">경로</p>
        </div>
        <a class="btn" th:href="@{/admin/org}">목록으로</a>
      </div>

      <form data-edit-form class="admin-form-panel" th:action="@{/admin/org/rename}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <input type="hidden" name="teamId" th:value="${node.id}">
        <div class="form-section-title">조직 이름</div>
        <div class="admin-form-grid">
          <div class="field span-2"><label for="name">이름</label>
            <input id="name" name="name" th:value="${node.name}" maxlength="100" required></div>
        </div>
        <div class="form-actions">
          <span class="muted">조직 이름을 변경하면 조직도와 경로 표시에 즉시 반영됩니다.</span>
          <div><button class="btn primary" type="submit">이름 저장</button></div>
        </div>
      </form>

      <form data-edit-form class="admin-form-panel" th:action="@{/admin/org/leader}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <input type="hidden" name="teamId" th:value="${node.id}">
        <div class="form-section-title">조직장 지정</div>
        <div class="admin-form-grid">
          <div class="field span-2"><label for="leaderUserId">조직장</label>
            <select id="leaderUserId" name="leaderUserId">
              <option value="">지정 해제</option>
              <option th:each="u : ${users}" th:value="${u.id}" th:selected="${u.id == node.leaderUserId}" th:text="${u.name + (!#strings.isEmpty(u.teamName) ? ' · ' + u.teamName : '')}">직원</option>
            </select>
          </div>
        </div>
        <div class="form-actions">
          <span class="muted">조직장으로 지정된 직원은 해당 조직의 팀장 권한을 갖습니다.</span>
          <div><button class="btn primary" type="submit">조직장 저장</button></div>
        </div>
      </form>

      <details class="form-panel member-order-panel" open>
        <summary><h2 th:text="${node.nodeType == 'DIVISION'} ? '본부 인원' : '팀 인원'">팀 인원</h2></summary>
        <div class="member-order-head">
          <span class="muted">팀장/본부장 제외 · 직원 노출 순서 조정 또는 소속 해제를 처리합니다.</span>
          <div class="act-wrap"><button type="button" id="reorderToggle" class="btn">수정하기</button><button type="button" id="reorderCancel" class="btn" hidden>취소</button></div>
        </div>
        <form id="memberOrderForm" th:action="@{/admin/org/{id}/member-order(id=${node.id})}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
          <ul class="member-order-list" id="memberList">
            <li class="member-row" th:each="m : ${orderMembers}" th:data-uid="${m.id}">
              <input type="hidden" name="order" th:value="${m.id}">
              <span class="mo-name" th:text="${m.name}">이름</span>
              <span class="mo-sub" th:text="${m.jobTitle != null and !#strings.isEmpty(m.jobTitle)} ? ${m.jobTitle} : (${m.dept} ?: '')">직책</span>
              <span class="mo-ops">
                <button type="button" class="rbtn mo-up" disabled aria-label="위로">▲</button>
                <button type="button" class="rbtn mo-down" disabled aria-label="아래로">▼</button>
                <button type="button" class="rbtn del mo-remove" disabled
                        th:formaction="@{/admin/org/{id}/members/{uid}/remove(id=${node.id},uid=${m.id})}"
                        th:data-remove-url="@{/admin/org/{id}/members/{uid}/remove(id=${node.id},uid=${m.id})}">제거</button>
              </span>
            </li>
            <li class="member-empty muted" th:if="${#lists.isEmpty(orderMembers)}">정렬할 인원이 없습니다.</li>
          </ul>
        </form>
      </details>

      <section class="form-panel ws-edit-surface" th:if="${releaseFeatures.reportsEnabled and node.nodeType == 'TEAM'}">
        <div class="section-head ws-edit-surface-head"><h2>주간보고 작성 대상</h2></div>
        <form data-edit-form th:action="@{/admin/org/weekly-target}" method="post" id="wtForm">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
          <input type="hidden" name="teamId" th:value="${node.id}">
          <input type="hidden" name="target" id="wtTarget" th:value="${node.weeklyReportTarget == null or node.weeklyReportTarget}">
          <label class="vf-switch">
            <input type="checkbox" id="wtToggle" th:checked="${node.weeklyReportTarget == null or node.weeklyReportTarget}">
            <span class="vf-switch-track"><span class="vf-switch-thumb"></span></span>
            <span class="vf-switch-text">주간보고 작성·취합 대상</span>
          </label>
          <div class="form-actions"><button class="btn primary" type="submit">설정 저장</button></div>
        </form>
      </section>


      <section class="admin-danger-panel">
        <div>
          <h3>조직 삭제</h3>
          <p th:text="${node.deletable} ? '하위 조직과 소속 직원이 없으면 삭제할 수 있습니다. 되돌릴 수 없습니다.' : ${node.deleteBlockReason}">삭제 안내</p>
        </div>
        <form th:if="${node.deletable}" th:action="@{/admin/org/{id}/delete(id=${node.id})}" method="post"
              data-confirm-message="이 조직을 삭제하시겠습니까? 되돌릴 수 없습니다."
              data-confirm-ok="삭제" data-confirm-danger="true">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
          <button class="btn danger" type="submit">조직 삭제</button>
        </form>
        <button th:unless="${node.deletable}" class="btn danger" type="button" disabled
                th:title="${node.deleteBlockReason}">조직 삭제</button>
      </section>
    </div>
  </main>
</div>
</body>
</html>
